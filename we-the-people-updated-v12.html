function leagueRecordsHTML(D){
  const T=[];
  D.Bs.filter(B=>B.done).forEach(B=>{
    const A=analyze(B),trs=tradesFor(B),n=Number(B.league.settings.playoff_teams||6);
    B.rosters.slice().sort((a,b)=>b.settings.wins-a.settings.wins||pfB(b)-pfB(a)).forEach((r,i)=>{
      const t=A.T[r.roster_id];if(!t)return;
      const f=t.res.slice(0,4),tn=trs.filter(a=>a.sides.some(x=>x.rid===r.roster_id));
      T.push({name:tname(B,r.roster_id),m:mgr(B,r.roster_id),yr:B.year,w:r.settings.wins,l:r.settings.losses,t:r.settings.ties,pf:pfB(r),pa:pfB(r,'fpts_against'),po:i<n,
        sw:f.filter(x=>x==='W').length,sg:f.length,trades:tn.length,net:sum(tn.flatMap(a=>a.sides.filter(x=>x.rid===r.roster_id).map(x=>x.net||0)))});
    });
  });
  const cards=[],card=(l,main,sub)=>cards.push(`<div class="award"><div class="award-label">${l}</div><strong>${main}</strong><div class="award-meta">${sub||''}</div></div>`);
  const meta=x=>`${esc(x.m)} · ${x.yr}`,wp=x=>(x.w+x.t/2)/Math.max(1,x.w+x.l+x.t),rc=x=>wl(x.w,x.l,x.t);
  const mx=f=>T.slice().sort((a,b)=>f(b)-f(a))[0],mn=f=>mx(x=>-f(x));
  if(T.length){
    let x=mx(a=>wp(a)+a.pf/1e7);card('Best single-season record',esc(x.name),`${rc(x)} · ${meta(x)}`);
    x=mn(a=>wp(a)-a.pf/1e7);card('Worst single-season record',esc(x.name),`${rc(x)} · ${meta(x)}`);
    x=mx(a=>a.pf);card('Best single-season points for',esc(x.name),`${num(x.pf)} PF · ${meta(x)}`);
    x=mn(a=>a.pf);card('Worst single-season points for',esc(x.name),`${num(x.pf)} PF · ${meta(x)}`);
    x=mx(a=>a.pa);card('Most points against in a season',esc(x.name),`${num(x.pa)} PA <span class="faint">(${rc(x)})</span> · ${meta(x)}`);
    x=mn(a=>a.pa);card('Fewest points against in a season',esc(x.name),`${num(x.pa)} PA <span class="faint">(${rc(x)})</span> · ${meta(x)}`);
    x=mx(a=>a.trades);card('Most trades in a year',esc(x.name),`${x.trades} trades · ${meta(x)}`);
    x=mx(a=>a.net);card('Best single-season net points from trades',esc(x.name),`${sgn(x.net)} pts/wk combined · ${meta(x)}`);

    if(np.length){x=np.slice().sort((a,b)=>b.sw/Math.max(1,b.sg)-a.sw/Math.max(1,a.sg)||b.pf-a.pf)[0];card('Best start to miss the playoffs',esc(x.name),`${x.sw}-${x.sg-x.sw} through ${x.sg} games, finished ${rc(x)} · ${meta(x)}`);}
  }
  let best=null;
  D.Bs.forEach(B=>{const A=analyze(B),PP=ppw(B),v={};A.dw.forEach(w=>Object.entries(PP[w]||{}).forEach(([id,p])=>v[id]=(v[id]||0)+p));Object.entries(v).forEach(([id,p])=>{if(!best||p>best.p)best={id,p,yr:B.year};});});

  const sent={};D.Bs.forEach(B=>B.tx.filter(t=>t.type==='trade'&&t.ok&&t.cr).forEach(t=>sent[t.cr]=(sent[t.cr]||0)+1));
  const ts=Object.entries(sent).sort((a,b)=>b[1]-a[1])[0];
  card('Most trade offers sent',ts?esc(D.M[ts[0]]?.name||'Unknown'):'Not available',ts?`${ts[1]} two-sided offers on record`:'Sleeper did not return trade creators');
  const mv=[];D.Bs.forEach(B=>waiversFor(B).moves.forEach(m=>mv.push({...m,B})));
  const bw=mv.slice().sort((a,b)=>b.st-a.st)[0],bb=mv.slice().sort((a,b)=>b.bid-a.bid)[0];
  if(bw&&bw.st>0)card('Best single-season waiver pickup',esc(playerName(bw.pid)),`${num(bw.st)} starter pts for ${N_(bw.B,bw.rid)} · ${bw.B.year}`);
  if(bb&&bb.bid>0)card('Biggest waiver bid ever',`$${bb.bid}`,`${esc(playerName(bb.pid))} · ${N_(bb.B,bb.rid)} · ${bb.B.year}`);
  const ps=[];D.Bs.forEach(B=>{const d=draftFor(B);if(d)d.ps.forEach(p=>ps.push({...p,B}));});
  const lst=a=>a.slice(1,3).map(p=>`${esc(playerName(p.pid))} ${sgn(p.d)} (${p.B.year})`).join(' · ');
  if(ps.length){
    const st=ps.slice().sort((a,b)=>b.d-a.d),bu=ps.slice().sort((a,b)=>a.d-b.d);
    card('Biggest draft steal vs slot',esc(playerName(st[0].pid)),`${sgn(st[0].d)} pts over slot · pick ${st[0].rd}.${String(st[0].n).padStart(2,'0')} by ${N_(st[0].B,st[0].rid)} · ${st[0].B.year}<br><span class="faint">${lst(st)}</span>`);
    card('Biggest draft bust vs slot',esc(playerName(bu[0].pid)),`${sgn(bu[0].d)} pts under slot · pick ${bu[0].rd}.${String(bu[0].n).padStart(2,'0')} by ${N_(bu[0].B,bu[0].rid)} · ${bu[0].B.year}<br><span class="faint">${lst(bu)}</span>`);
  }
  return panel('All-time records','Completed seasons',`<div class="award-grid">${cards.join('')}</div>`,'Start = first 4 games of the season. “Made the playoffs” = finished in the top playoff seeds by regular-season record. Trade records exclude one-sided trades.');
}

function strengthHTML(B,A){
  const live=B.id===LEAGUE_ID&&state&&String(state.season)===String(B.league.season),slots=B.league.roster_positions||[];
  const nBN=Math.max(3,Math.min(6,slots.filter(s=>s==='BN').length||5));
  const val=id=>{
    const a=pAvgs(B,id),pr=live&&currentProjections[id]?projectionPoints(currentProjections[id]):null;
    if(!a.g)return pr!=null?pr*.9:0;
    const base=.6*a.s+.4*a.l3;
    return pr!=null?.8*base+.2*pr:base;
  };
  const P=['QB','RB','WR','TE','K','DEF'];
  const rows=B.rosters.map(r=>{
    const vm={};(r.players||[]).forEach(id=>vm[id]=val(id));
    const o=optimalSet(B,vm);
    const bn=sum((r.players||[]).filter(id=>!o.used.has(id)).map(id=>vm[id]).sort((a,b)=>b-a).slice(0,nBN));
    const ps={};P.forEach(p=>{const k=Math.max(1,slots.filter(s=>s===p).length);ps[p]=sum((r.players||[]).filter(id=>pos(id)===p).map(id=>vm[id]).sort((a,b)=>b-a).slice(0,k));});
    return {rid:r.roster_id,st:o.tot,bn,tot:o.tot+.35*bn,ps};
  }).sort((a,b)=>b.tot-a.tot);
  const prk={};P.forEach(p=>{rows.slice().sort((a,b)=>b.ps[p]-a.ps[p]).forEach((x,i)=>(prk[p]??={})[x.rid]=i+1);});
  const last=A.dw.length-1;
  return panel('Strength of rosters','Starters + bench, projection-aware',
    barRows(rows.map(x=>({label:tname(B,x.rid),v:x.tot})),{fmt:num})
    +tbl(['#','Team','Starters','Bench depth','Strength','QB','RB','WR','TE','vs results'],rows.map((x,i)=>{
      const pr=last>=0?A.R[last][x.rid]:null,d=pr!=null?pr-(i+1):0;
      const tag=pr==null?'—':d>=3?'<span class="positive">Roster better than record</span>':d<=-3?'<span class="negative">Overperforming roster</span>':'<span class="muted">In line</span>';
      return [i+1,`<strong>${N_(B,x.rid)}</strong>`,num(x.st),num(x.bn),`<strong>${num(x.tot)}</strong>`,'#'+prk.QB[x.rid],'#'+prk.RB[x.rid],'#'+prk.WR[x.rid],'#'+prk.TE[x.rid],tag];
    })),
    `Each player’s value = 60% season pts/wk + 40% last-3 pts/wk (league scoring)${live&&projectionsAvailable()?', blended 80/20 with this week’s Sleeper projection':''}. Starters = the best legal lineup from the current roster. Strength = starters + 35% of the best bench players (depth/injury cover). Position columns rank each group’s starting-slot strength. “vs results” compares roster strength rank with the record-based power rank.`);
}

function perfFor(B,u){
  const A=analyze(B),wks=A.weekly.filter(x=>x.w<=u),n=wks.length;
  const rows=wks.flatMap(x=>x.rows),games=wks.flatMap(x=>x.games),mg=games.map(g=>Math.abs(g.a.p-g.b.p));
  const tx=B.tx.filter(t=>t.leg<=u),ad=t=>Object.keys(t.adds||{}).length,T=Object.values(A.T);
  const effs=T.flatMap(t=>t.eff.slice(0,n)).filter(v=>v!=null);
  return {pts:sum(rows.map(x=>x.p)),ppg:mean(rows.map(x=>x.p)),hi:Math.max(0,...rows.map(x=>x.p)),
    trades:tx.filter(isTrade).length,offers:tx.filter(t=>t.type==='trade'&&t.ok).length,
    waiv:sum(tx.filter(t=>t.type==='waiver').map(ad)),fa:sum(tx.filter(t=>t.type==='free_agent').map(ad)),faab:sum(tx.filter(t=>t.type==='waiver').map(t=>t.bid)),
    moves:tx.filter(t=>t.type!=='trade'||isTrade(t)).length,
    margin:mean(mg),close:mg.filter(m=>m<5).length,blow:mg.filter(m=>m>=40).length,
    eff:mean(effs)*100,left:sum(T.map(t=>sum(t.leftw.slice(0,n)))),
    empty:sum(rows.map(x=>x.s.filter(i=>i==='0'||!i).length)),
    zero:sum(rows.map(x=>x.s.filter(i=>i&&i!=='0'&&!(x.pp[i]>0)).length))};
}

function perfCard(title,vals,fmt,now,was,good,live,prevYr,note){
  const mx=Math.max(1e-9,...vals.map(v=>v.v+(v.proj||0)));
  const pct=was?((now-was)/Math.abs(was)*100):null;
  const up=pct!=null&&pct>=0,cls=pct==null||!good?'muted':((good>0)===up?'positive':'negative');
  return `<div class="pcard"><div class="award-label">${title}</div><div class="pbig">${fmt(vals[vals.length-1].v)}</div>
    <div class="small ${cls}">${pct==null?'No prior year to compare':`${up?'▲':'▼'} ${Math.abs(pct).toFixed(1)}% vs ${prevYr}${live?' at this point':''}`}</div>
    <div class="pcols">${vals.map(v=>`<div class="pcol"><em>${v.v==null?'—':fmt(v.v)}</em><div class="pbar"><i class="pb ${v.cur?'cur':''}" style="height:${v.v/mx*100}%"></i>${v.proj?`<i class="pb pj" style="height:${v.proj/mx*100}%"></i>`:''}</div><span>${v.y}</span></div>`).join('')}</div>
    ${note?`<div class="small muted">${note}</div>`:''}</div>`;
}

async function rPerf(){
  const D=await needAll(),Bs=D.Bs,cur=BD[LEAGUE_ID]||Bs[Bs.length-1];
  const live=isLive(cur),AC=analyze(cur),U=live?AC.dw.length:Infinity;
  const per=Bs.map(B=>({B,full:perfFor(B,Infinity),part:perfFor(B,U)})),ci=Bs.indexOf(cur),prev=per[ci-1];
  const remW=live?Math.max(0,cur.reg-U):0,rest=remW*sum(Object.values(AC.T).map(t=>t.avg));
  const cards=PM.map(([title,k,fmt,good])=>{
    const vals=per.map(p=>{const c=p.B===cur;return {y:p.B.year,v:c&&live?p.part[k]:p.full[k],proj:c&&live&&k==='pts'?rest:0,cur:c};});
    return perfCard(title,vals,fmt,per[ci].part[k],prev?prev.part[k]:null,good,live,prev?.B.year,k==='pts'&&live?`Hatched = projected rest of regular season (${num(Math.round(vals[vals.length-1].v+rest))} total).`:live&&ci===Bs.length-1?'Current season to date.':'');
  });
  const nc=Bs.map((B,i)=>{
    if(!i)return {y:B.year,v:null,cur:B===cur};
    const p=Bs[i-1];return {y:B.year,v:B.users.filter(u=>{const q=p.users.find(x=>x.user_id===u.user_id);return q&&q.team_name&&u.team_name&&q.team_name!==u.team_name;}).length,cur:B===cur};
  });
  const ncv=nc.map(x=>({...x,v:x.v??0}));
  cards.push(perfCard('Team-name changes vs prior year',ncv,n=>n,ncv[ncv.length-1].v,ncv.length>1?ncv[ncv.length-2].v:null,0,false,Bs[Math.max(0,Bs.length-2)].year,'Managers who renamed their team (Sleeper only exposes current names per season).'));
  const p0=per[ci],pct=(k)=>prev&&prev.part[k]?((p0.part[k]-prev.part[k])/Math.abs(prev.part[k])*100):null;
  const ar=v=>v==null?'':(v>=0?'▲ ':'▼ ')+Math.abs(v).toFixed(1)+'%';
  const head=`<div class="banner">As a league in ${cur.year}${live?`, through Week ${U}`:''}: <strong>${num(Math.round(p0.part.pts))}</strong> points scored ${prev?`(<span class="${pct('pts')>=0?'positive':'negative'}">${ar(pct('pts'))}</span> vs ${prev.B.year}${live?' at this point':''})`:''}${live?`, on pace for <strong>${num(Math.round(p0.part.pts+rest))}</strong>`:''}. <strong>${p0.part.trades}</strong> trades, <strong>${p0.part.waiv}</strong> waiver pickups, <strong>$${num(p0.part.faab)}</strong> FAB spent.</div>`;
  return head+`<div class="pgrid">${cards.join('')}</div><p class="small muted">Bars are full-season totals for completed years and season-to-date for the current year. Percent changes compare the same point in last season. Regular season only. Sleeper doesn’t store historical injury status, so “zero-point starters” (a starter who scored nothing — out, on bye or inactive) is the closest available measure; empty slots are lineup spots left unfilled.</p>`;
}
