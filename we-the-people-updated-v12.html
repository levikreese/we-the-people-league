<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>WE THE PEOPLE LEAGUE HUB</title>
<style>

:root{--bg:#0b1020;--panel:#121a2c;--panel2:#182238;--line:#27334b;--text:#edf2ff;--muted:#91a0bb;--accent:#8b7cff;--green:#45d6a0;--red:#ff7185;--gold:#f4c76b}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 20% -10%,#25214c 0,transparent 40%),var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial}
header{padding:22px max(18px,calc((100vw - 1200px)/2));border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:18px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#8b7cff,#40c9b4);display:grid;place-items:center;font-weight:900;font-size:20px;color:#090d19}
.eyebrow{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1.6px}
.brand h1{font-size:19px;margin:2px 0 0}
.actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.status{color:var(--muted);font-size:12px}
.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:6px;box-shadow:0 0 10px #45d6a0}
button,select{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:9px 12px;font:inherit}
button{cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:white;font-weight:700}
main{max-width:1240px;margin:0 auto;padding:24px 18px 60px}
.hero{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.hero h2{font-size:26px;margin:0}
.hero p{color:var(--muted);margin:5px 0 0}
.week-control{display:flex;gap:8px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:16px 0}
.stat,.panel{background:linear-gradient(180deg,rgba(24,34,56,.96),rgba(18,26,44,.96));border:1px solid var(--line);border-radius:15px}
.stat{padding:16px}
.stat .label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1px}
.stat .value{font-size:27px;font-weight:800;margin-top:6px}
.stat .sub{color:var(--muted);font-size:12px;margin-top:2px}
.tabs{display:flex;gap:6px;overflow:auto;padding:4px 0 14px}
.tab{white-space:nowrap;color:var(--muted);background:transparent}
.tab.active{color:white;background:var(--panel2);border-color:#514a91}
.panel{padding:17px;margin-bottom:14px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:13px}
.panel h3{margin:0;font-size:15px}
.muted{color:var(--muted)}
.small{font-size:12px}
.overview-columns{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(300px,.88fr);gap:12px;align-items:start}
.overview-columns .panel{padding:14px}
.match{display:grid;grid-template-columns:minmax(0,1fr) 170px minmax(0,1fr);gap:8px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);max-width:100%;margin:0 auto}
.match:last-child{border:0}
.match-side{min-width:0}
.match-side strong{display:block;overflow-wrap:anywhere;font-size:12px}
.match-side span{display:block;color:var(--muted);font-size:11px}
.match-side:last-child{text-align:right}
.match-side .score-line{font-size:15px;font-weight:800;color:var(--text)}
.match-side .winner{color:var(--green)!important}
.match-side .winner:after{content:" ▲";font-size:10px}
.match-side .loss{color:#ffbd72!important;text-shadow:0 0 4px #ff4c1e,0 0 10px #ff7a1a,0 -4px 13px #ffb52e}
.proj{display:block;color:var(--gold)!important;font-size:11px!important;margin-top:3px}
.dynamite{display:grid;grid-template-columns:minmax(0,1fr) 38px minmax(0,1fr);align-items:center;gap:0;width:100%;height:54px;position:relative}
.dynamite-sticks{position:relative;z-index:3;font-size:31px;line-height:1;display:flex;align-items:center;justify-content:center;transform:rotate(90deg);filter:drop-shadow(0 2px 4px #000b);width:38px;height:40px}
.fuse-track{height:5px;width:100%;position:relative;overflow:visible;border:0;background:transparent;min-width:0}
.fuse-track:before{content:"";position:absolute;top:0;height:5px;width:calc(var(--chance)*1%);min-width:3px;background:var(--fuse-color);border-radius:99px;box-shadow:0 0 8px var(--fuse-color)}
.fuse-left:before{right:0}
.fuse-right:before{left:0}
.fuse-spark{position:absolute;top:50%;width:8px;height:8px;transform:translateY(-50%);border-radius:50%;background:#fff7b0;box-shadow:0 0 5px 3px #ff9d36,0 0 12px 5px #ff5b36;z-index:2}
.fuse-left .fuse-spark{right:calc(var(--chance)*1% - 4px)}
.fuse-right .fuse-spark{left:calc(var(--chance)*1% - 4px)}
.fuse-label{position:absolute;top:39px;left:50%;transform:translateX(-50%);font-size:8px;color:var(--muted);white-space:nowrap}
.explosion{font-size:29px;line-height:1;color:#ff9c35;text-shadow:0 0 5px #ff5a22,0 0 14px #ffb12e;filter:drop-shadow(0 0 7px #ff8c27);animation:boom-pop .28s cubic-bezier(.2,.8,.25,1) both;transform-origin:center}
@keyframes boom-pop{0%{transform:scale(.15);opacity:0}65%{transform:scale(1.28);opacity:1}100%{transform:scale(1);opacity:1}}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:560px}
th,td{text-align:left;padding:11px 9px;border-bottom:1px solid var(--line)}
th{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:600}
td{font-size:13px}
tr:last-child td{border:0}
.positive{color:var(--green)}
.negative{color:var(--red)}
.tx{display:flex;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.award-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.award{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:13px;min-width:0}
.award .award-label{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:1px}
.award strong{display:block;margin:5px 0;font-size:15px}
.award-meta{color:var(--muted);font-size:12px}
.history-row{display:grid;grid-template-columns:70px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.history-row:last-child{border:0}
.week-tag{color:var(--muted);font-size:12px}
.history-player{font-weight:700}
.history-sub{font-size:12px;color:var(--muted)}
.award-score{font-weight:800;color:var(--gold)}
.pill{border:1px solid var(--line);padding:3px 7px;border-radius:99px;color:var(--muted);font-size:11px}
.empty{color:var(--muted);padding:24px;text-align:center}
.error{color:var(--red);background:#311c2a;border:1px solid #673449;border-radius:10px;padding:12px;margin:12px 0}
.footer{color:var(--muted);font-size:11px;text-align:center;margin-top:22px}
.trade{border:1px solid var(--line);border-radius:13px;background:var(--panel2);padding:13px;margin-bottom:10px}
.trade-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.trade-sides{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.tside{background:rgba(0,0,0,.18);border:1px solid var(--line);border-radius:10px;padding:11px;min-width:0}
.tside.win{border-color:var(--green)}
.tside h4{margin:0 0 4px;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.tp{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:3px 0}
.tp em{color:var(--muted);font-style:normal;font-size:10px}
.tlabel{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:1px;margin-top:9px}
.net{font-size:20px;font-weight:800;margin-top:8px}
.tdet{border-bottom:1px solid var(--line)}.tdet:last-child{border:0}.tdet summary{display:flex;justify-content:space-between;gap:14px;padding:10px 0;cursor:pointer;list-style:none}.tdet summary::-webkit-details-marker{display:none}.tdet summary:before{content:"▸";color:var(--muted);margin-right:6px}.tdet[open] summary:before{content:"▾"}.tdet summary strong{flex:1}.tdet .tp{padding:3px 0 3px 16px}.tdet[open]{padding-bottom:8px}
@media(max-width:900px){.overview-columns{grid-template-columns:1fr}}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.award-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){header{padding:16px}.grid{gap:8px}.stat{padding:12px}.stat .value{font-size:23px}.hero h2{font-size:22px}.match{grid-template-columns:minmax(0,1fr) 100px minmax(0,1fr);gap:5px}.dynamite{grid-template-columns:minmax(0,1fr) 30px minmax(0,1fr)}.dynamite-sticks{font-size:24px;width:30px}.award-grid{grid-template-columns:1fr}}
.hero-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#seasonWrap{display:flex;gap:8px;align-items:center}
.banner{background:linear-gradient(90deg,rgba(244,199,107,.18),rgba(139,124,255,.12));border:1px solid #6b5a2a;border-radius:13px;padding:13px 16px;margin-bottom:14px;font-size:15px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
.grid2>.panel{margin-bottom:0}
.grid2{margin-bottom:14px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
/* charts */
.chart{width:100%}
.cw{position:relative}
.cw svg{width:100%;height:auto;display:block;overflow:visible}
.gl{stroke:var(--line);stroke-width:1}
.ax{fill:var(--muted);font-size:11px}
.ln{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s cubic-bezier(.4,.1,.2,1) forwards;transition:opacity .2s,stroke-width .2s}
.chart.hi .ln{opacity:.12}.chart.hi .ln.on{opacity:1;stroke-width:3.8}
@keyframes draw{to{stroke-dashoffset:0}}
.ar{opacity:0;animation:fade .9s .5s forwards}
@keyframes fade{to{opacity:1}}
.gd{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.lg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:11px;background:var(--panel2)}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.chip.off{opacity:.4;text-decoration:line-through}
.tt{display:none;position:absolute;top:8px;z-index:5;background:rgba(10,14,28,.95);border:1px solid var(--line);border-radius:11px;padding:9px 11px;font-size:11px;pointer-events:none;min-width:150px;backdrop-filter:blur(6px);box-shadow:0 8px 30px #0008}
.tt b{display:block;margin-bottom:5px;font-size:12px}
.tt div{display:flex;align-items:center;gap:6px;padding:1px 0}.tt div span{flex:1}.tt div em{font-style:normal;font-weight:700}
.tt i{width:8px;height:8px;border-radius:50%;display:inline-block}
.sc{width:100%;height:auto}.sc .pl{fill:var(--text);font-size:10px;opacity:.85}.sc .pt circle{transition:r .15s}.sc .pt:hover circle{r:10}
/* bars */
.bars{margin-bottom:12px}
.brow{display:grid;grid-template-columns:minmax(90px,170px) 1fr 62px;gap:10px;align-items:center;padding:4px 0}
.bl{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt{position:relative;height:14px;background:rgba(255,255,255,.04);border-radius:99px;overflow:hidden}
.bt.dv:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line)}
.bb{position:absolute;top:0;bottom:0;border-radius:99px;transform-origin:left;animation:grow .8s cubic-bezier(.2,.8,.2,1) both}
.bb.pos{background:linear-gradient(90deg,#40c9b4,#45d6a0)}
.bb.neg{background:linear-gradient(270deg,#ff7185,#ff9f7d);transform-origin:right}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.bv{font-size:12px;font-weight:700;text-align:right}
/* heat tables */
table.hm{min-width:0}table.hm th,table.hm td{padding:7px 6px;text-align:center;font-size:11px;white-space:nowrap}
table.hm td:first-child,table.hm th:first-child{text-align:left;position:sticky;left:0;background:var(--panel)}
td.dg{color:var(--muted)}
/* reports */
.rc{display:grid;grid-template-columns:1fr auto 1fr auto;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;align-items:center}
.rc:last-child{border:0}.rc em{font-style:normal;color:var(--muted);font-size:11px}
/* calculator */
.cl{max-height:320px;overflow:auto;margin-top:8px}
.cp{display:grid;grid-template-columns:auto 1fr auto;gap:8px;padding:6px 4px;font-size:12px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center}
.cp em{color:var(--muted);font-style:normal;font-size:10px}
.calc-out{margin-top:12px;padding:12px;background:var(--panel2);border-radius:11px;font-size:13px;line-height:1.7}
/* managers */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.mcard{background:linear-gradient(180deg,rgba(24,34,56,.96),rgba(18,26,44,.96));border:1px solid var(--line);border-radius:15px;padding:16px}
.mh{display:flex;gap:12px;align-items:center}
.av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#8b7cff,#40c9b4);display:grid;place-items:center;font-weight:900;color:#090d19;font-size:18px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0;min-height:22px}
.tag{background:rgba(139,124,255,.16);border:1px solid #514a91;border-radius:99px;padding:2px 9px;font-size:11px}
.mstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mstats div{background:var(--panel2);border-radius:9px;padding:7px 4px;text-align:center}
.mstats b{display:block;font-size:13px}.mstats span{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.spark{width:100%;height:36px;margin-top:4px}
/* wrapped */
.wr{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(3,5,12,.94);backdrop-filter:blur(8px)}
.wr[hidden]{display:none}
.wr-bar{position:absolute;top:18px;left:50%;transform:translateX(-50%);width:min(560px,92vw);display:flex;gap:4px}
.wr-bar i{flex:1;height:3px;border-radius:9px;background:rgba(255,255,255,.2)}
.wr-bar i.d{background:#fff}.wr-bar i.a{background:linear-gradient(90deg,#fff 60%,rgba(255,255,255,.2))}
.wr-slide{width:min(560px,92vw);min-height:min(76vh,620px);border-radius:28px;padding:36px;display:flex;flex-direction:column;justify-content:center;gap:14px;box-shadow:0 30px 90px #000a;text-align:center}
.wr-slide.in>*{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.wr-slide.in .wt{animation-delay:.08s}.wr-slide.in .wb{animation-delay:.18s}.wr-slide.in .ws{animation-delay:.3s}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
.wk{font-size:12px;letter-spacing:2.4px;text-transform:uppercase;opacity:.8}
.wt{font-size:30px;font-weight:800;line-height:1.15}
.wb{font-size:74px;font-weight:900;line-height:1;text-shadow:0 6px 30px #0006}
.ws{font-size:15px;opacity:.85;max-width:420px;margin:0 auto}
.wr-nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;font-size:22px;padding:0}
#wrPrev{left:max(8px,calc(50% - 360px))}#wrNext{right:max(8px,calc(50% - 360px))}
.wr-x{position:absolute;top:14px;right:16px}
@media(max-width:700px){.wr-nav{top:auto;bottom:22px;transform:none}#wrPrev{left:22%}#wrNext{right:22%}.wb{font-size:56px}.wt{font-size:24px}}
@media(max-width:520px){.rc{grid-template-columns:1fr;gap:2px}.brow{grid-template-columns:88px 1fr 52px}.mstats{grid-template-columns:repeat(2,1fr)}}

/* ===== v3: spacing polish ===== */
main{padding:20px 16px 64px}
.hero{align-items:flex-end;margin-bottom:14px}
.hero-right{gap:12px}
.panel{padding:16px 16px 14px;margin-bottom:14px}
.panel-head{flex-wrap:wrap;margin-bottom:12px}
.panel-head h3{font-size:15px}
.grid{margin:12px 0}
.tabs{gap:6px;padding:2px 0 12px;scrollbar-width:thin}
.faint{opacity:.6;font-size:11px}
.pill.ok{color:var(--green);border-color:#2b6b55}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:2px}
.seg button{border:0;background:transparent;padding:6px 12px;color:var(--muted);border-radius:8px}
.seg button.on{background:var(--accent);color:#fff;font-weight:700}
/* matchups + donut */
.overview-columns{grid-template-columns:minmax(0,.86fr) minmax(0,1.14fr);gap:14px}
.overview-columns .panel{padding:16px}
.match{grid-template-columns:minmax(0,1fr) 104px minmax(0,1fr);gap:10px;padding:14px 0;align-items:start}
.match-side{display:flex;flex-direction:column;gap:2px}
.match-side:last-child{text-align:right;align-items:flex-end}
.match-side strong{font-size:13px;line-height:1.25}
.match-side .score-line{font-size:17px}
.pc{font-size:12px!important;font-weight:700;color:var(--muted)!important}
.pc.pg{color:var(--green)!important}.pc.pr{color:var(--red)!important}
.proj2{font-size:11px!important;color:var(--gold)!important;min-height:14px}
.match-side .winner{color:#aaffdc!important;text-shadow:0 0 6px #45d6a0,0 0 16px #1fbf86,0 0 28px rgba(69,214,160,.55)}
.match-side .winner:after{content:none}
.crown{font-size:28px;line-height:1;margin-top:4px;filter:drop-shadow(0 0 8px #f4c76b) drop-shadow(0 0 16px rgba(244,199,107,.6));animation:boom-pop .35s cubic-bezier(.2,.8,.25,1) both}
.donut{width:104px;height:104px;align-self:center}
.donut svg{width:100%;height:100%;overflow:visible}
.donut .dt{fill:none;stroke:rgba(255,255,255,.07);stroke-width:13}
.donut .da{fill:none;stroke-width:13;stroke-linecap:butt;animation:dn .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes dn{from{stroke-dasharray:0 240}}
.donut .dp{fill:var(--text);font-size:17px;font-weight:800;text-anchor:middle}
.donut .ds{fill:var(--muted);font-size:7.5px;letter-spacing:1px;text-anchor:middle}
/* bracket */
.bk{display:flex;gap:12px;overflow:auto;padding-bottom:4px}
.bk .rd{min-width:170px;flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:10px}
.bk h5{margin:0 0 2px;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:1.2px}
.bk .bm{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;display:grid;gap:5px}
.bk .sd{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--accent);color:#fff;font-size:10px;font-weight:800;margin-right:4px}
.bk em{color:var(--muted);font-style:normal;font-size:10px}
/* accordions */
.acc{border:1px solid var(--line);border-radius:13px;background:var(--panel2);margin-bottom:8px;overflow:hidden}
.acc>summary{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:13px 15px;cursor:pointer;list-style:none;align-items:center}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary:before{content:"▸";color:var(--muted);margin-right:8px}
.acc[open]>summary:before{content:"▾"}
.acc>summary strong{flex:1;min-width:140px}
.acc-body{padding:4px 15px 15px}
.minis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:12px}
.mini{background:rgba(0,0,0,.2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px}
.mini .award-label{margin-bottom:5px}
/* h2h */
td.cl{cursor:pointer;transition:filter .15s}td.cl:hover{filter:brightness(1.4)}td.cl.sel{outline:2px solid var(--accent);outline-offset:-2px}
/* performance board */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-bottom:14px}

<script>let projView='table',tradeTeam='all';
const wl=(w,l,t)=>`${w}-${l}${t?'-'+t:''}`;
const isTrade=t=>t.type==='trade'&&t.st==='complete'&&t.ok;

/* ======================================================================
   WE THE PEOPLE LEAGUE HUB — multi-season edition
   Hosted as a static page (GitHub Pages friendly). Data: Sleeper public API.
   ====================================================================== */
const LEAGUES=['1322960728918888448','1180655804110102528','1048958574157754368','989672963316207616']; // newest first
const LEAGUE_ID=LEAGUES[0];
const API='https://api.sleeper.app/v1';
const DATA_API='https://api.sleeper.com';
const POS_Q=['QB','RB','WR','TE','K','DEF'].map(p=>`position[]=${p}`).join('&');
const MIN_GAMES_FOR_RANK=1;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=n=>Number(n||0).toLocaleString(undefined,{maximumFractionDigits:2});
const sgn=n=>(n>0?'+':'')+num(n);
const sum=a=>a.reduce((s,v)=>s+v,0);
const mean=a=>a.length?sum(a)/a.length:0;
const LS={get(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};

let league,users=[],rosters=[],state,matchups=[],players={},week=1,activeTab='overview';
let completedTrades=0,teamTradeCounts={};
let seasonPlayerStats={},draftPickByPlayer={},teamMargins={},awards=[],awardFilter='All';
let currentProjections={},currentWeekStats={},currentSchedule=[];
let initialized=false,seasonDataWeek=null,histStarted=false;
let overviewNews=null,overviewNewsPromise=null;
let BD={},BP={},sel=LEAGUE_ID,reportW=null,tradeSort='lopsided';
const POST=[];

/* ---------- data access ---------- */
async function get(path){
  const r=await fetch(API+path);
  if(!r.ok)throw new Error(`${r.status} ${path}`);
  return r.json();
}
async function getData(path){
  const go=async p=>{const r=await fetch(DATA_API+p);if(!r.ok)throw new Error(`${r.status} ${p}`);return r.json();};
  if(/^\/(projections|stats)\/nfl\//.test(path)){
    try{
      const d=await go(`${path}&${POS_Q}`);
      if(Array.isArray(d)?d.length:Object.keys(d||{}).length)return d;
    }catch(e){}
  }
  return go(path);
}
function normalizeRows(data){
  const out={};
  const put=(id,item)=>{if(!id)return;out[id]={...(item?.stats||item||{}),__game_id:item?.game_id,__team:item?.team};};
  if(Array.isArray(data))data.forEach(it=>put(String(it.player_id??it.playerId??it.id??it.player?.player_id??''),it));
  else if(data&&typeof data==='object')Object.entries(data).forEach(([id,it])=>put(String(id),it));
  return out;
}
async function loadPlayers(){
  if(!Object.keys(players).length)players=await get('/players/nfl');
}

/* ---------- live-season helpers (unchanged behaviour) ---------- */
const curWeek=()=>Number(state?.week||week);
function owner(rosterId){
  const r=rosters.find(x=>x.roster_id===rosterId);
  return users.find(x=>x.user_id===r?.owner_id);
}
function teamName(roster){
  const u=owner(roster.roster_id);
  return u?.metadata?.team_name||u?.display_name||`Team ${roster.roster_id}`;
}
function rosterName(id){return teamName(rosters.find(r=>r.roster_id===id)||{roster_id:id});}
function playerName(id){
  const p=players[id]||{};
  return p.full_name||[p.first_name,p.last_name].filter(Boolean).join(' ')||id;
}
function pos(id){return players[id]?.position||'';}
function score(m){return Number(m?.points??m?.settings?.fpts??0);}
function fantasyPts(row){
  const rec=Number(league?.scoring_settings?.rec??0);
  if(rec>=1)return Number(row?.pts_ppr??row?.pts??0);
  if(rec>0)return Number(row?.pts_half_ppr??row?.pts??0);
  return Number(row?.pts_std??row?.pts??0);
}
const projectionPoints=row=>fantasyPts(row||{});
const playerStatPoints=row=>fantasyPts(row);
const playerActualPoints=id=>fantasyPts(currentWeekStats[id]||{});
const starters=m=>(m?.starters||[]).filter(id=>id&&id!=='0').map(String);
function playerHasStarted(id){
  const row=currentWeekStats[String(id)];
  return !!row&&(Number(row.gp||0)>0||Number(row.gs||0)>0);
}
function pf(r,k='fpts'){return Number(r.settings?.[k]||0)+Number(r.settings?.[k+'_decimal']||0)/100;}
const teamPoints=r=>pf(r);
function faabSpent(r){
  const u=r.settings?.waiver_budget_used;
  return u===undefined||u===null?null:Number(u);
}
function metricCard(label,value,sub=''){
  return `<div class="stat"><div class="label">${label}</div><div class="value">${value}</div><div class="sub">${sub}</div></div>`;
}
function groupMatchups(rows){
  const groups={};
  (rows||[]).forEach(m=>{
    const id=m.matchup_id??`bye-${m.roster_id}`;
    (groups[id]??=[]).push(m);
  });
  return Object.values(groups).filter(g=>g.length>1);
}
const groupsForRoster=id=>groupMatchups(matchups).find(g=>g.some(m=>m.roster_id===id));

/* ONE projection model: projected final = live score + points still to come
   from starters whose NFL game isn't finished. */
function projectionsAvailable(){return Object.keys(currentProjections).length>0;}
function projFor(id){
  const row=currentProjections[id];
  if(row)return projectionPoints(row);
  if(projectionsAvailable())return 0;
  const x=seasonPlayerStats[id];
  return x?.games?x.total/x.games:0;
}
function gameStatusForPlayer(id){
  const p=players[id]||{},pr=currentProjections[id]||{};
  const games=(currentSchedule||[]).filter(g=>Number(g.week)===Number(week));
  const gid=String(pr.__game_id??'');
  if(gid){const g=games.find(x=>String(x.game_id)===gid);if(g)return g.status||'pre_game';}
  const team=p.team||pr.__team;
  if(team&&games.length){
    const g=games.find(x=>x.home===team||x.away===team);
    return g?(g.status||'pre_game'):'bye';
  }
  return playerHasStarted(id)?'in_game':'pre_game';
}
function remainingFor(id){
  const st=gameStatusForPlayer(id);
  if(st==='complete'||st==='canceled'||st==='bye')return 0;
  const proj=projFor(id);
  return st==='in_game'?Math.max(0,proj-playerActualPoints(id)):Math.max(0,proj);
}
const remainingProjection=m=>starters(m).reduce((s,id)=>s+remainingFor(id),0);
function teamProjection(m){
  if(week<curWeek())return score(m);
  return score(m)+remainingProjection(m);
}
const remainingVariance=m=>starters(m).reduce((s,id)=>s+Math.pow(remainingFor(id)*.42,2),0);
function matchupFinished(a,b){
  if(week<curWeek())return true;
  const ids=[...starters(a),...starters(b)];
  return ids.length>0&&ids.every(id=>['complete','canceled','bye'].includes(gameStatusForPlayer(id)));
}
function erf(x){
  const sign=x<0?-1:1;
  x=Math.abs(x);
  const t=1/(1+.3275911*x);
  const y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-.284496736)*t+.254829592)*t*Math.exp(-x*x);
  return sign*y;
}
const normalCdf=x=>.5*(1+erf(x/Math.sqrt(2)));
function winChance(a,b){
  const sa=score(a),sb=score(b);
  if(matchupFinished(a,b))return sa>sb?100:sa<sb?0:50;
  if(!starters(a).length||!starters(b).length)return null;
  const margin=teamProjection(a)-teamProjection(b);
  const sd=Math.sqrt(remainingVariance(a)+remainingVariance(b));
  if(sd<1)return margin>0?99:margin<0?1:50;
  return Math.max(1,Math.min(99,Math.round(normalCdf(margin/sd)*100)));
}
function fuseColor(chance){
  const hue=Math.max(0,Math.min(120,Number(chance)||0));
  return `hsl(${hue},85%,48%)`;
}

/* ======================================================================
   MULTI-SEASON DATA LAYER
   One "bundle" per league ID: league, users, rosters, weekly matchups
   (with per-player points), trades/waivers, draft picks and champion.
   Past seasons are cached in localStorage so reloads are instant.
   ====================================================================== */
async function buildBundle(id,force){
  const ck='fh3:'+id;
  if(!force&&id!==LEAGUE_ID){const c=LS.get(ck);if(c&&c.done)return c;}
  const [lg,us,ro]=await Promise.all([get(`/league/${id}`),get(`/league/${id}/users`),get(`/league/${id}/rosters`)]);
  const po=Number(lg.settings?.playoff_week_start||15),reg=Math.max(1,po-1);
  const [wk,legs,drafts,br]=await Promise.all([
    Promise.all(Array.from({length:reg},(_,i)=>get(`/league/${id}/matchups/${i+1}`).catch(()=>[]))),
    Promise.all(Array.from({length:19},(_,i)=>get(`/league/${id}/transactions/${i}`).catch(()=>[]))),
    get(`/league/${id}/drafts`).catch(()=>[]),
    get(`/league/${id}/winners_bracket`).catch(()=>[])
  ]);
  const dr=(drafts||[]).find(d=>d.status==='complete')||(drafts||[])[0];
  const pk=dr?await get(`/draft/${dr.draft_id}/picks`).catch(()=>[]):[];
  const fin=(br||[]).find(m=>m.p===1);
  let cr=null;
  if(fin&&fin.w){const wkC=po+(Number(fin.r)||1)-1;const crow=await get(`/league/${id}/matchups/${wkC}`).catch(()=>[]);const cx=(crow||[]).find(y=>y.roster_id===fin.w);if(cx)cr={week:wkC,p:Number(cx.points||0),s:(cx.starters||[]).map(String),pp:cx.players_points||{}};}
  const B={
    id,year:String(lg.season),done:lg.status==='complete',reg,
    league:{name:lg.name,season:String(lg.season),status:lg.status,roster_positions:lg.roster_positions||[],
      settings:{playoff_week_start:po,playoff_teams:lg.settings?.playoff_teams,waiver_budget:lg.settings?.waiver_budget}},
    users:(us||[]).map(u=>({user_id:u.user_id,display_name:u.display_name,team_name:u.metadata?.team_name||''})),
    rosters:(ro||[]).map(r=>({roster_id:r.roster_id,owner_id:r.owner_id,players:r.players||[],
      settings:{wins:r.settings?.wins||0,losses:r.settings?.losses||0,ties:r.settings?.ties||0,
        fpts:r.settings?.fpts||0,fpts_decimal:r.settings?.fpts_decimal||0,
        fpts_against:r.settings?.fpts_against||0,fpts_against_decimal:r.settings?.fpts_against_decimal||0,
        waiver_budget_used:r.settings?.waiver_budget_used||0}})),
    W:wk.map(rows=>(rows||[]).map(x=>({r:x.roster_id,m:x.matchup_id,p:Number(x.points||0),s:(x.starters||[]).map(String),pp:x.players_points||{}}))),
    tx:legs.flatMap((rows,leg)=>(rows||[]).filter(t=>t&&(t.type==='trade'||(t.status==='complete'&&['waiver','free_agent'].includes(t.type)))).map(t=>{
      const o={id:t.transaction_id,type:t.type,st:t.status,cr:t.creator||null,leg,rids:t.roster_ids||[],adds:t.adds||{},drops:t.drops||{},
        picks:t.draft_picks||[],faab:t.waiver_budget||[],bid:Number(t.settings?.waiver_bid||0),created:t.created};
      o.ok=t.type==='trade'?tradeOK(o):true;return o;})),
    picks:(pk||[]).filter(p=>p.player_id).map(p=>({n:p.pick_no,rd:p.round,rid:p.roster_id,pid:String(p.player_id)})),
    champ:fin&&fin.w?{w:fin.w,l:fin.l}:null,champRoster:cr
  };
  if(B.done&&id!==LEAGUE_ID)LS.set(ck,B);
  return B;
}
function loadBundle(id,force){
  if(!force&&BP[id])return BP[id];
  return BP[id]=buildBundle(id,force).then(b=>(BD[id]=b)).catch(e=>{delete BP[id];throw e;});
}
async function ready(id){
  while(!state)await new Promise(r=>setTimeout(r,120));
  await loadPlayers();
  return loadBundle(id);
}

/* ---------- analysis engine ---------- */
function isLive(B){return B.id===LEAGUE_ID&&B.league.status!=='complete'&&!!state&&String(state.season)===String(B.league.season);}
function doneWeeks(B){
  const live=isLive(B),out=[];
  for(let w=1;w<=B.reg;w++){
    const rows=B.W[w-1]||[];
    const played=rows.length>0&&rows.some(r=>r.p>0);
    if(live?w<Number(state.week):played)out.push(w);else break;
  }
  return out;
}
function tname(B,rid){
  const r=B.rosters.find(x=>x.roster_id===rid);
  const u=B.users.find(x=>x.user_id===r?.owner_id);
  return u?.team_name||u?.display_name||`Team ${rid}`;
}
function mgr(B,rid){
  const r=B.rosters.find(x=>x.roster_id===rid);
  return B.users.find(x=>x.user_id===r?.owner_id)?.display_name||'';
}
const pfB=(r,k='fpts')=>Number(r.settings[k]||0)+Number(r.settings[k+'_decimal']||0)/100;
const FLEX={FLEX:p=>['RB','WR','TE'].includes(p),WRRB_FLEX:p=>['RB','WR'].includes(p),REC_FLEX:p=>['WR','TE'].includes(p),SUPER_FLEX:p=>['QB','RB','WR','TE'].includes(p)};
function optimal(B,pp){return optimalSet(B,pp).tot;}
function analyze(B){
  const dw=doneWeeks(B);
  if(B.A&&B.A.dw.length===dw.length)return B.A;
  const N=B.rosters.length,T={};
  B.rosters.forEach(r=>T[r.roster_id]={rid:r.roster_id,uid:r.owner_id,name:tname(B,r.roster_id),
    w:0,l:0,t:0,pf:0,pa:0,sc:[],opp:[],res:[],apw:[],winw:[],eff:[],leftw:[],left:0,ap:0});
  const weekly=[];
  dw.forEach(w=>{
    const rows=(B.W[w-1]||[]).filter(x=>T[x.r]);
    const games=[],seen=new Set();
    rows.forEach(x=>{
      const t=T[x.r];
      const o=x.m!=null?rows.find(y=>y.m===x.m&&y.r!==x.r):null;
      t.sc.push(x.p);t.pf+=x.p;t.opp.push(o?o.r:null);
      let res='';
      if(o){
        t.pa+=o.p;res=x.p>o.p?'W':x.p<o.p?'L':'T';t[res.toLowerCase()]++;
        if(!seen.has(x.m)){seen.add(x.m);games.push({a:x,b:o,w});}
      }
      t.res.push(res);t.winw.push(res==='W'?1:res==='T'?.5:0);
      let ap=0;rows.forEach(y=>{if(y.r!==x.r)ap+=x.p>y.p?1:x.p===y.p?.5:0;});
      const apf=rows.length>1?ap/(rows.length-1):0;
      t.apw.push(apf);t.ap+=apf;
      const opt=optimal(B,x.pp);
      t.eff.push(opt>0?Math.min(1,x.p/opt):null);
      const lf=opt>0?Math.max(0,opt-x.p):0;t.left+=lf;t.leftw.push(lf);
    });
    weekly.push({w,rows,games});
  });
  Object.values(T).forEach(t=>{
    const g=t.sc.length||1;
    t.avg=t.pf/g;
    t.sd=Math.sqrt(sum(t.sc.map(v=>(v-t.avg)**2))/Math.max(1,t.sc.length-1));
    t.expW=t.ap;t.luck=t.w+t.t/2-t.expW;t.paAvg=t.pa/g;
    const es=t.eff.filter(v=>v!=null);t.effAvg=es.length?mean(es):null;
  });
  const P=[],R=[];
  dw.forEach((w,k)=>{
    const sc={};
    Object.values(T).forEach(t=>{
      sc[t.rid]=100*(.5*mean(t.apw.slice(0,k+1))+.3*mean(t.apw.slice(Math.max(0,k-2),k+1))+.2*mean(t.winw.slice(0,k+1)));
    });
    P.push(sc);
    const order=Object.keys(sc).sort((a,b)=>sc[b]-sc[a]),rk={};
    order.forEach((r,i)=>rk[r]=i+1);R.push(rk);
  });
  return B.A={dw,T,weekly,P,R,N};
}
/* weekly points per player (league scoring, while rostered), max across rosters */
function ppw(B){
  if(B.PP)return B.PP;
  B.PP={};
  for(let w=1;w<=B.reg;w++){
    const m={};
    (B.W[w-1]||[]).forEach(x=>Object.entries(x.pp||{}).forEach(([id,v])=>{if(m[id]===undefined||v>m[id])m[id]=v;}));
    B.PP[w]=m;
  }
  return B.PP;
}
function pAvgs(B,id){
  const PP=ppw(B),dw=analyze(B).dw;
  const v=dw.map(w=>PP[w]?.[id]).filter(x=>x!=null);
  return {s:mean(v),l3:mean(v.slice(-3)),g:v.length};
}
/* trades: net pts/wk for each team = avg weekly pts of players received - players sent, weeks after the trade */
function tradesFor(B){
  const A=analyze(B),done=A.dw.length,PP=ppw(B);
  return B.tx.filter(isTrade).map(t=>{
    const weeks=[];
    for(let w=Number(t.leg||0)+1;w<=done;w++)weeks.push(w);
    const n=weeks.length;
    const avg=id=>n?weeks.reduce((a,w)=>a+(PP[w]?.[id]||0),0)/n:null;
    const sides=[...new Set(t.rids||[])].map(rid=>{
      const got=Object.entries(t.adds||{}).filter(([,r])=>r===rid).map(([p])=>p);
      const sent=Object.entries(t.drops||{}).filter(([,r])=>r===rid).map(([p])=>p);
      const g=sum(got.map(id=>avg(id)||0)),s=sum(sent.map(id=>avg(id)||0));
      return {rid,got,sent,net:n?g-s:null,netTotal:n?(g-s)*n:0,
        picksIn:(t.picks||[]).filter(p=>p.owner_id===rid),picksOut:(t.picks||[]).filter(p=>p.previous_owner_id===rid),
        faab:(t.faab||[]).reduce((a,w)=>a+(w.receiver===rid?Number(w.amount||0):0)-(w.sender===rid?Number(w.amount||0):0),0)};
    });
    const nets=sides.map(s=>s.net).filter(v=>v!==null);
    return {t,n,avg,sides,best:nets.length?Math.max(...nets):-1e9,spread:nets.length?Math.max(...nets)-Math.min(...nets):-1e9};
  });
}
/* waivers: points a claimed player scored for the claiming team after the claim */
function waiversFor(B){
  if(B.WV)return B.WV;
  const done=analyze(B).dw.length,row=(w,rid)=>(B.W[w-1]||[]).find(x=>x.r===rid);
  const moves=[];
  B.tx.filter(t=>t.type==='waiver'||t.type==='free_agent').forEach(t=>{
    Object.entries(t.adds||{}).forEach(([pid,rid])=>{
      let tot=0,st=0;
      for(let w=Math.max(1,t.leg);w<=done;w++){
        const x=row(w,rid);
        if(x&&x.pp[pid]!=null){tot+=x.pp[pid];if(x.s.includes(pid))st+=x.pp[pid];}
      }
      moves.push({pid,rid,leg:t.leg,type:t.type,bid:t.type==='waiver'?t.bid:0,tot,st});
    });
  });
  const T={};
  B.rosters.forEach(r=>T[r.roster_id]={rid:r.roster_id,name:tname(B,r.roster_id),n:0,bid:0,st:0,tot:0,spent:r.settings.waiver_budget_used});
  moves.forEach(m=>{const t=T[m.rid];if(!t)return;t.n++;t.bid+=m.bid;t.st+=m.st;t.tot+=m.tot;});

/* draft: value over expected for the slot (season points vs neighbouring picks) */
function draftFor(B){
  if(B.D!==undefined&&B.D&&B.D.k===analyze(B).dw.length)return B.D;
  if(!B.picks.length)return B.D=null;
  const A=analyze(B),PP=ppw(B),val={};
  A.dw.forEach(w=>Object.entries(PP[w]||{}).forEach(([id,v])=>val[id]=(val[id]||0)+v));
  const ps=B.picks.slice().sort((a,b)=>a.n-b.n).map(p=>({...p,v:val[p.pid]||0}));
  ps.forEach((p,i)=>{
    const win=ps.slice(Math.max(0,i-5),i+6).filter(x=>x!==p);
    p.exp=mean(win.map(x=>x.v));p.d=p.v-p.exp;
  });
  const teams={};
  B.rosters.forEach(r=>teams[r.roster_id]={rid:r.roster_id,name:tname(B,r.roster_id),d:0,v:0,picks:[]});
  ps.forEach(p=>{const t=teams[p.rid];if(!t)return;t.d+=p.d;t.v+=p.v;t.picks.push(p);});
  const arr=Object.values(teams).sort((a,b)=>b.d-a.d);
  arr.forEach((t,i)=>{const q=arr.length>1?i/(arr.length-1):0;t.grade=q<.17?'A':q<.4?'B':q<.65?'C':q<.85?'D':'F';});

/* playoff odds: Monte Carlo of the remaining regular-season schedule */
function gauss(mu,sd){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return mu+sd*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function simOdds(B,sims=4000){
  const A=analyze(B),teams=Object.values(A.T),n=Number(B.league.settings.playoff_teams||6);
  const rem=[];
  for(let w=A.dw.length+1;w<=B.reg;w++){
    const g={};(B.W[w-1]||[]).forEach(x=>{if(x.m!=null)(g[x.m]??=[]).push(x.r);});
    const pairs=Object.values(g).filter(p=>p.length===2);
    if(pairs.length)rem.push(pairs);
  }
  const mu={},sd={};
  teams.forEach(t=>{
    const last=t.sc.slice(-6),wts=last.map((_,i)=>i+1);
    const recent=last.length?sum(last.map((v,i)=>v*wts[i]))/sum(wts):0;
    mu[t.rid]=t.sc.length?.5*t.avg+.5*recent:0;sd[t.rid]=Math.max(14,t.sd||0);
  });
  const res={};teams.forEach(t=>res[t.rid]={po:0,top:0,w:0});
  for(let s=0;s<sims;s++){
    const w={},p={};teams.forEach(t=>{w[t.rid]=t.w+t.t/2;p[t.rid]=t.pf;});
    rem.forEach(pairs=>pairs.forEach(([a,b])=>{
      const sa=gauss(mu[a],sd[a]),sb=gauss(mu[b],sd[b]);
      p[a]+=sa;p[b]+=sb;if(sa>sb)w[a]++;else w[b]++;
    }));
    teams.map(t=>t.rid).sort((x,y)=>w[y]-w[x]||p[y]-p[x]).forEach((r,i)=>{
      res[r].w+=w[r];if(i<n)res[r].po++;if(i===0)res[r].top++;
    });
  }
  return {res,sims,n,remWeeks:rem.length};
}

function smoothPath(p){
  const n=p.length;
  if(n===1)return `M${p[0][0]},${p[0][1]}`;
  if(n===2)return `M${p[0][0]},${p[0][1]}L${p[1][0]},${p[1][1]}`;
  const dx=[],m=[];
  for(let i=0;i<n-1;i++){dx[i]=p[i+1][0]-p[i][0];m[i]=(p[i+1][1]-p[i][1])/dx[i];}
  const t=[m[0]];
  for(let i=1;i<n-1;i++)t[i]=m[i-1]*m[i]<=0?0:2/(1/m[i-1]+1/m[i]);
  t[n-1]=m[n-2];
  let d=`M${p[0][0]},${p[0][1]}`;
  for(let i=0;i<n-1;i++){
    const h=dx[i]/3;
    d+=`C${p[i][0]+h},${p[i][1]+t[i]*h} ${p[i+1][0]-h},${p[i+1][1]-t[i+1]*h} ${p[i+1][0]},${p[i+1][1]}`;
  }
  return d;
}
function drawLine(el,c){

}
function matchupHTML(groups,expandable=false){
  if(!groups.length)return '<div class="empty">No matchups available.</div>';
  return groups.map((g,i)=>{
    const a=g[0],b=g[1],sa=score(a),sb=score(b);
    const fin=matchupFinished(a,b),ca=winChance(a,b),none=ca===null;
    const cha=none?50:ca,chb=100-cha,lead=cha>chb?'a':chb>cha?'b':'';
    const stA=fin?(sa>sb?'win':sa<sb?'lose':''):lead==='a'?'lead':lead==='b'?'trail':'';
    const stB=fin?(sb>sa?'win':sb<sa?'lose':''):lead==='b'?'lead':lead==='a'?'trail':'';
    const card=`<div class="match">${sideHTML(rosterName(a.roster_id),sa,none?null:cha,teamProjection(a),stA)}${donut(cha,chb,fin,none)}${sideHTML(rosterName(b.roster_id),sb,none?null:chb,teamProjection(b),stB)}${expandable?'<div class="match-expand-hint">Select matchup to view both full rosters · actual and projected points</div>':''}</div>`;
    return expandable?`<div class="matchup-wrap"><div class="match-select" data-match-expand="${i}" role="button" tabindex="0" aria-expanded="false">${card}</div><div class="match-rosters" id="matchRoster${i}" hidden><div class="match-roster-grid">${matchupRosterHTML(a)}${matchupRosterHTML(b)}</div></div></div>`:card;
  }).join('');
}

function renderProjectedStandings(){
  const s=league?.settings||{};
  const start=Number(s.start_week||1),po=Number(s.playoff_week_start||0);
  if(po&&week>=po)return '<div class="empty">Regular season is over — no projections.</div>';
  const base=rosters.map(r=>({r,wins:Number(r.settings?.wins||0),losses:Number(r.settings?.losses||0),ties:Number(r.settings?.ties||0),points:pf(r)}));
  const cmp=(a,b)=>b.wins-a.wins||b.points-a.points;
  const now={};
  base.slice().sort(cmp).forEach((x,i)=>now[x.r.roster_id]=i+1);
  const rows=base.map(x=>{
    const y={...x};
    const counted=(x.wins+x.losses+x.ties)>=week-start+1;
    const g=groupsForRoster(x.r.roster_id);
    const own=g?.find(m=>m.roster_id===x.r.roster_id),opp=g?.find(m=>m.roster_id!==x.r.roster_id);
    if(counted||!own||!opp)return y;
    const fin=matchupFinished(own,opp);
    if(!fin&&!projectionsAvailable()&&score(own)+score(opp)===0)return y;
    const a=teamProjection(own),b=teamProjection(opp);
    y.points+=a;
    if(Math.abs(a-b)<0.005)y.ties++;else if(a>b)y.wins++;else y.losses++;
    return y;
  }).sort(cmp);
  if(projView==='bracket')return bracketHTML(rows);
  return `<div class="table-wrap"><table>
    <thead><tr><th>#</th><th>Team</th><th>Now</th><th>Proj.</th><th>Proj PF</th></tr></thead>
    <tbody>${rows.map((x,i)=>{
      const d=now[x.r.roster_id]-(i+1);
      const mv=d>0?`<span class="positive">▲${d}</span>`:d<0?`<span class="negative">▼${-d}</span>`:'<span class="muted">–</span>';
      return `<tr><td>${i+1}</td><td><strong>${esc(teamName(x.r))}</strong></td><td>#${now[x.r.roster_id]} ${mv}</td>
        <td>${wl(x.wins,x.losses,x.ties)}</td><td>${num(x.points)}</td></tr>`;
    }).join('')}</tbody></table></div>`;
}

async function loadOverviewNews(){
  const target=$('#overviewNewsList');
  if(!target)return;
  if(overviewNews){
    target.innerHTML=overviewNews;
    return;
  }
  if(!overviewNewsPromise){
    overviewNewsPromise=Promise.all(
      Array.from({length:19},(_,i)=>get(`/league/${LEAGUE_ID}/transactions/${i}`).catch(()=>[]))
    ).then(rows=>{
      const tx=rows.flat().filter(Boolean).map(t=>{
        const playerNames=[...new Set([
          ...Object.keys(t.adds||{}).map(playerName),
          ...Object.keys(t.drops||{}).map(playerName)
        ])].sort((a,b)=>a.localeCompare(b));
        return {...t,__playerNames:playerNames,__sortName:playerNames[0]||'~'};
      }).sort((a,b)=>{
        const timeDiff=Number(b.created||0)-Number(a.created||0);
        if(timeDiff)return timeDiff;
        return a.__sortName.localeCompare(b.__sortName)||a.__playerNames.join('|').localeCompare(b.__playerNames.join('|'));
      });
      const renderTx=t=>{
        const date=t.created?new Date(Number(t.created)).toLocaleString():'Date unavailable';
        const type=String(t.type||'transaction').replace(/_/g,' ');
        const status=String(t.status||'unknown').replace(/_/g,' ');
        const teams=[...new Set((t.roster_ids||[]).map(rosterName))];
        const moveLines=[];
        Object.entries(t.adds||{}).sort((a,b)=>playerName(a[0]).localeCompare(playerName(b[0]))).forEach(([pid,rid])=>moveLines.push(`<div class="small"><span class="positive">Added</span> ${esc(playerName(pid))} <span class="muted">→ ${esc(rosterName(rid))}</span></div>`));
        Object.entries(t.drops||{}).sort((a,b)=>playerName(a[0]).localeCompare(playerName(b[0]))).forEach(([pid,rid])=>moveLines.push(`<div class="small"><span class="negative">Dropped</span> ${esc(playerName(pid))} <span class="muted">(${esc(rosterName(rid))})</span></div>`));
        (t.draft_picks||[]).forEach(pk=>moveLines.push(`<div class="small">Draft pick <span class="muted">Round ${esc(pk.round??'—')}, pick ${esc(pk.pick_no??'—')} · ${esc(rosterName(pk.owner_id??pk.roster_id))}</span></div>`));
        if(t.waiver_budget?.length)moveLines.push(...t.waiver_budget.map(x=>`<div class="small">FAAB transfer <span class="muted">${esc(rosterName(x.sender))} → ${esc(rosterName(x.receiver))}: $${num(x.amount)}</span></div>`));
        const detail=moveLines.length?moveLines.join(''):'<div class="small muted">No player or draft-pick details supplied by Sleeper.</div>';
        const isTrade=String(t.type||'').toLowerCase()==='trade';
        return `<article class="tx${isTrade?' news-trade-alert':''}" style="display:block">
          <div class="trade-head">${isTrade?'<span class="news-trade-siren" aria-label="Trade alert" title="Trade alert">🚨</span>':''}<strong>${isTrade?'TRADE ALERT':esc(type.toUpperCase())}</strong>${isTrade?'<span class="news-trade-siren" aria-hidden="true">🚨</span>':''}<span class="pill">${esc(status)}</span></div>
          <div class="small muted">${esc(date)}${teams.length?` · ${teams.map(esc).join(' · ')}`:''}</div>
          <div style="margin-top:8px">${detail}</div>
        </article>`;
      };
      const trades=tx.filter(t=>String(t.type||'').toLowerCase()==='trade');
      const waiverMoves=tx.filter(t=>['waiver','free_agent'].includes(String(t.type||'').toLowerCase()));
      const renderColumn=(items,empty)=>items.length?items.map(renderTx).join(''):`<div class="empty">${empty}</div>`;
      overviewNews=`<div class="news-columns">
        <section class="news-column"><div class="news-column-head"><strong>WAIVER ADDS &amp; DROPS</strong><span class="pill">${waiverMoves.length}</span></div><div class="news-column-feed">${renderColumn(waiverMoves,'No waiver adds or drops yet.')}</div></section>

      </div>`;
      return overviewNews;
    }).catch(e=>{
      overviewNews='<div class="empty">Could not load transactions from Sleeper. Try refreshing the page.</div>';
      console.error('Sleeper transaction feed failed',e);
      return overviewNews;
    });
  }
  target.innerHTML=await overviewNewsPromise;
}

function schedMatrix(A){
  const ids=Object.keys(A.T),M={};
  ids.forEach(x=>{M[x]={};ids.forEach(y=>{
    let w=0;
    A.weekly.forEach(({rows},i)=>{
      const rx=rows.find(r=>String(r.r)===x),oid=A.T[y].opp[i];
      if(!rx||oid==null)return;
      const os=String(oid)===x?rows.find(r=>String(r.r)===y)?.p:rows.find(r=>r.r===oid)?.p;
      if(os==null)return;
      w+=rx.p>os?1:rx.p===os?.5:0;
    });
    M[x][y]=w;
  });});
  return M;
}

function weekReport(B,A,w){
  const wk=A.weekly.find(x=>x.w===w),idx=A.dw.indexOf(w);
  const games=wk.games.map(g=>{const win=g.a.p>=g.b.p?g.a:g.b,lose=win===g.a?g.b:g.a;return {win,lose,m:win.p-lose.p};});
  const rows=wk.rows,by=(arr,f)=>arr.slice().sort((a,b)=>f(b)-f(a));
  const hi=by(rows,x=>x.p)[0],lo=by(rows,x=>-x.p)[0],blow=by(games,g=>g.m)[0],close=by(games,g=>-g.m)[0];
  const apOf=x=>A.T[x.r].apw[idx];
  const lw=by(games,g=>-apOf(g.win))[0],ul=by(games,g=>apOf(g.lose))[0];
  const eff=by(rows.filter(x=>A.T[x.r].eff[idx]!=null),x=>A.T[x.r].eff[idx])[0];
  const aw=(l,t,s)=>`<div class="award"><div class="award-label">${l}</div><strong>${t}</strong><div class="award-meta">${s}</div></div>`;
  const star=[],bench=[];

function calcInit(B){
  const val=id=>{const a=pAvgs(B,id);return .6*a.s+.4*a.l3;};
  const fill=side=>{
    const rid=Number($('#cs'+side).value),r=B.rosters.find(x=>x.roster_id===rid);
    const list=(r?.players||[]).map(id=>({id,...pAvgs(B,id)})).filter(x=>x.g>0).sort((a,b)=>val(b.id)-val(a.id)).slice(0,30);
    $('#cl'+side).innerHTML=list.map(x=>`<label class="cp"><input type="checkbox" data-s="${side}" value="${x.id}"><span>${esc(playerName(x.id))} <em>${esc(pos(x.id))}</em></span><span class="muted">${num(x.s)} · L3 ${num(x.l3)}</span></label>`).join('');
    $('#cl'+side).querySelectorAll('input').forEach(i=>i.addEventListener('change',calc));
  };
  const calc=()=>{
    const pick=s=>[...document.querySelectorAll(`#cl${s} input:checked`)].map(i=>i.value);
    const a=pick('A'),b=pick('B');
    if(!a.length&&!b.length){$('#calcOut').innerHTML='Tick the players each side would give up.';return;}
    const va=sum(a.map(val)),vb=sum(b.map(val)),net=vb-va;
    $('#calcOut').innerHTML=`<strong>${esc($('#csA').selectedOptions[0].text)}</strong> gives ${num(va)} ppg and gets ${num(vb)} ppg → <span class="${net>=0?'positive':'negative'}"><strong>${sgn(net)} ppg</strong></span><br><strong>${esc($('#csB').selectedOptions[0].text)}</strong> → <span class="${-net>=0?'positive':'negative'}"><strong>${sgn(-net)} ppg</strong></span>`;
  };
  if(B.rosters.length>1)$('#csB').selectedIndex=1;
  ['A','B'].forEach(s=>{$('#cs'+s).addEventListener('change',()=>{fill(s);calc();});fill(s);});
}

function allData(){
  const Bs=LEAGUES.map(id=>BD[id]).filter(Boolean).sort((a,b)=>a.year-b.year);
  const CAR={},M={},H2H={},rec={hi:[],lo:[],blow:[],close:[]},seasons=[];
  Bs.forEach(B=>{
    const A=analyze(B),D=draftFor(B);
    const order=B.rosters.slice().sort((a,b)=>b.settings.wins-a.settings.wins||pfB(b)-pfB(a));
    const own={};B.rosters.forEach(r=>own[r.roster_id]=r.owner_id);
    const tc={};B.tx.filter(isTrade).forEach(t=>[...new Set(t.rids)].forEach(r=>tc[r]=(tc[r]||0)+1));
    order.forEach((r,i)=>{
      const t=A.T[r.roster_id]||{sc:[],res:[],eff:[],luck:0},u=B.users.find(x=>x.user_id===r.owner_id);
      const m=M[r.owner_id]??={uid:r.owner_id,name:'',team:'',seasons:0,w:0,l:0,t:0,pf:0,pa:0,titles:0,runner:0,fin:[],yrs:[],luck:0,trades:0,faab:0,effs:[],sc:[],draft:0,res:''};
      m.name=u?.display_name||m.name||'Unknown';m.team=u?.team_name||m.team;
      m.seasons++;m.w+=r.settings.wins;m.l+=r.settings.losses;m.t+=r.settings.ties;m.pf+=pfB(r);m.pa+=pfB(r,'fpts_against');
      m.fin.push(i+1);m.yrs.push(B.year);m.luck+=t.luck||0;m.trades+=tc[r.roster_id]||0;m.faab+=r.settings.waiver_budget_used;
      m.effs.push(...(t.eff||[]).filter(v=>v!=null));m.sc.push(...(t.sc||[]));m.res+=(t.res||[]).join('');
      if(B.champ?.w===r.roster_id)m.titles++;if(B.champ?.l===r.roster_id)m.runner++;
      if(D){const dt=D.teams.find(x=>x.rid===r.roster_id);if(dt)m.draft+=dt.d;}
    });
    A.weekly.forEach(({w,games,rows})=>{
      rows.forEach(x=>{const row={yr:B.year,w,n:tname(B,x.r),p:x.p};rec.hi.push(row);rec.lo.push(row);const cu=own[x.r];if(cu){const c=CAR[cu]??={pts:{},st:{},ro:{},yy:{},bid:null};Object.keys(x.pp).forEach(id=>{c.ro[id]=(c.ro[id]||0)+1;(c.yy[id]??=new Set()).add(B.year);});x.s.forEach(id=>{if(!id||id==='0')return;c.pts[id]=(c.pts[id]||0)+(x.pp[id]||0);c.st[id]=(c.st[id]||0)+1;});}});
      games.forEach(g=>{
        const win=g.a.p>=g.b.p?g.a:g.b,lose=win===g.a?g.b:g.a;
        const gm={yr:B.year,w,a:tname(B,win.r),b:tname(B,lose.r),ap:win.p,bp:lose.p,m:win.p-lose.p};
        rec.blow.push(gm);rec.close.push(gm);
        const ua=own[g.a.r],ub=own[g.b.r];
        if(ua&&ub){
          const r1=((H2H[ua]??={})[ub]??={w:0,l:0,t:0,g:[]}),r2=((H2H[ub]??={})[ua]??={w:0,l:0,t:0,g:[]});
          if(g.a.p>g.b.p){r1.w++;r2.l++;}else if(g.a.p<g.b.p){r1.l++;r2.w++;}else{r1.t++;r2.t++;}r1.g.push({yr:B.year,w,me:g.a.p,op:g.b.p});r2.g.push({yr:B.year,w,me:g.b.p,op:g.a.p});
        }
      });
    });
    B.tx.filter(t=>t.type==='waiver'&&t.bid>0).forEach(t=>Object.entries(t.adds||{}).forEach(([pid,rid])=>{const u=own[rid];if(!u)return;const c=CAR[u]??={pts:{},st:{},ro:{},yy:{},bid:null};if(!c.bid||t.bid>c.bid.v)c.bid={v:t.bid,pid,yr:B.year};}));
    const top=order[0],pfTop=B.rosters.slice().sort((a,b)=>pfB(b)-pfB(a))[0];
    seasons.push({B,top,pfTop,trades:B.tx.filter(isTrade).length});
  });
  rec.hi.sort((a,b)=>b.p-a.p);rec.lo.sort((a,b)=>a.p-b.p);rec.blow.sort((a,b)=>b.m-a.m);rec.close.sort((a,b)=>a.m-b.m);
  return {Bs,M,H2H,rec,seasons,CAR};
}

function spark(vals,max){
  const w=130,h=34,p=4;
  if(!vals.length)return '';
  const pts=vals.map((v,i)=>[p+(vals.length>1?i*(w-2*p)/(vals.length-1):(w-2*p)/2),p+(v-1)/Math.max(1,max-1)*(h-2*p)]);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}"><path d="${smoothPath(pts)}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/>${pts.map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="2.6" fill="var(--green)"/>`).join('')}</svg>`;
}

let slideI=0,SLIDES=[];
const GR=['linear-gradient(150deg,#4b34c9,#0f1f3d)','linear-gradient(150deg,#0e7a68,#0b1020)','linear-gradient(150deg,#b4492f,#1a1230)','linear-gradient(150deg,#b8860b,#1c1428)','linear-gradient(150deg,#1d5fd6,#10162b)','linear-gradient(150deg,#8c2a78,#0f1226)','linear-gradient(150deg,#2f7a2f,#0c1722)'];
function buildSlides(B){
  const A=analyze(B),T=Object.values(A.T),S=[];
  const add=(k,t,b,s)=>S.push({k,t,b,s,c:GR[S.length%GR.length]});
  const top=(arr,f)=>arr.slice().sort((a,b)=>f(b)-f(a))[0];
  add(`${B.year} season`,esc(B.league.name),'Wrapped',`${T.length} teams · ${A.dw.length} weeks played`);
  if(B.champ){const t=A.T[B.champ.w];if(t)add('Your champion',esc(t.name),'🏆',`${recS(t)} · ${num(t.pf)} points`);}
  else if(T.length){const t=top(T,x=>x.w+x.t/2);add('Regular-season leader',esc(t.name),'🥇',`${recS(t)} so far`);}
  if(!T.length||!A.dw.length)return S;
  const pt=top(T,t=>t.pf);add('Points machine',esc(pt.name),num(pt.pf),`${num(pt.avg)} points per week`);
  const lk=top(T,t=>t.luck),ul=top(T,t=>-t.luck);
  add('Luckiest team',esc(lk.name),sgn(lk.luck),`wins above expected — they had ${recS(lk)} but “should” have ${num(lk.expW)} wins`);
  add('Snake-bitten',esc(ul.name),sgn(ul.luck),`wins below expected — ${recS(ul)} vs ${num(ul.expW)} expected`);
  const R=[];A.weekly.forEach(({w,rows,games})=>{rows.forEach(x=>R.push({w,n:A.T[x.r].name,p:x.p}));});
  const hi=top(R,r=>r.p);add('Biggest week',esc(hi.n),num(hi.p),`points in Week ${hi.w}`);
  const G=[];A.weekly.forEach(({w,games})=>games.forEach(g=>{const win=g.a.p>=g.b.p?g.a:g.b,lose=win===g.a?g.b:g.a;G.push({w,a:A.T[win.r].name,b:A.T[lose.r].name,m:win.p-lose.p});}));
  if(G.length){const c=top(G,g=>-g.m);add('Closest game',esc(c.a),num(c.m)+' pts',`edged ${esc(c.b)} in Week ${c.w}`);}
  const TR=tradesFor(B).filter(a=>a.n>0);
  if(TR.length){const a=top(TR,x=>x.spread),w=top(a.sides,s=>s.net);add('Trade of the year',N_(B,w.rid),sgn(w.net)+' / wk',`won a Week ${a.t.leg} trade`);}
  const wv=waiversFor(B).moves.filter(m=>m.st>0);
  if(wv.length){const m=top(wv,x=>x.st);add('Waiver gem',esc(playerName(m.pid)),num(m.st)+' pts',`started for ${N_(B,m.rid)} after a Week ${m.leg} pickup`);}
  const D=draftFor(B);
  if(D){const p=top(D.ps,x=>x.d);add('Draft steal',esc(playerName(p.pid)),sgn(p.d),`over slot — pick ${p.rd}.${String(p.n).padStart(2,'0')} by ${N_(B,p.rid)}`);}
  const ef=top(T.filter(t=>t.effAvg!=null),t=>t.effAvg);
  if(ef)add('Lineup genius',esc(ef.name),Math.round(ef.effAvg*100)+'%',`of the best possible lineup, on average`);
  add('That’s a wrap','See you next season','🏈','Thanks for playing');
  return S;
}
async function openWrapped(){
  const B=await ready(sel);SLIDES=buildSlides(B);slideI=0;
  $('#wrapped').hidden=false;document.body.style.overflow='hidden';showSlide();

  $('#wrSlide').style.background=s.c;

/* ---------- awards / history ---------- */
function expectedForPlayer(id){
  const x=seasonPlayerStats[id];
  return x?.projectionGames?x.expected/x.projectionGames:null;
}
function actualAverage(id){
  const x=seasonPlayerStats[id];
  return x?.games?x.total/x.games:null;
}
function playerOverExpected(id){
  const actual=actualAverage(id),expected=expectedForPlayer(id);
  return actual===null||expected===null?null:actual-expected;
}
const rosteredIds=()=>new Set(rosters.flatMap(r=>r.players||[]));
function teamForPlayer(id){
  const roster=rosters.find(r=>(r.players||[]).includes(id));
  return roster?teamName(roster):'—';
}
function getPlayerLeaders(){
  const R=rosteredIds();
  const eligible=Object.keys(seasonPlayerStats).filter(id=>R.has(id)&&seasonPlayerStats[id]?.games>0);
  const highest=eligible.slice().sort((a,b)=>seasonPlayerStats[b].total-seasonPlayerStats[a].total)[0];
  const lowest=eligible.slice().sort((a,b)=>seasonPlayerStats[a].total-seasonPlayerStats[b].total)[0];
  const over=eligible.filter(id=>playerOverExpected(id)!==null).sort((a,b)=>playerOverExpected(b)-playerOverExpected(a))[0];
  const under=eligible.filter(id=>playerOverExpected(id)!==null).sort((a,b)=>playerOverExpected(a)-playerOverExpected(b))[0];
  return {highest,lowest,over,under};
}
function getTeamExpectedLeaders(){
  const totals={};
  rosters.forEach(r=>{
    let actual=0,expected=0,hasExpected=false;
    (r.players||[]).forEach(id=>{
      const x=seasonPlayerStats[id];
      if(!x)return;
      actual+=x.total;
      if(x.projectionGames){expected+=x.expected;hasExpected=true;}
    });
    if(hasExpected)totals[r.roster_id]={name:teamName(r),diff:actual-expected};
  });
  const rows=Object.values(totals);
  return {over:rows.slice().sort((a,b)=>b.diff-a.diff)[0],under:rows.slice().sort((a,b)=>a.diff-b.diff)[0]};
}
async function loadAwardHistory(){
  awards=[];
  const season=league.season;
  const completedWeeks=Math.max(0,curWeek()-1);
  if(!completedWeeks)return;
  const results=await Promise.all(Array.from({length:completedWeeks},async(_,i)=>{
    const w=i+1;
    const [stats,projections]=await Promise.all([
      getData(`/stats/nfl/${season}/${w}?season_type=regular`).catch(()=>({})),
      getData(`/projections/nfl/${season}/${w}?season_type=regular`).catch(()=>[])
    ]);
    return {week:w,stats:normalizeRows(stats),projections:normalizeRows(projections)};
  }));
  const rostered=new Set(rosters.flatMap(r=>r.players||[]));
  results.forEach(({week:w,stats,projections})=>{
    const weekly=[];
    Object.entries(stats).forEach(([id,row])=>{
      if(!rostered.has(id)||!players[id])return;
      const actual=playerStatPoints(row),projectedRow=projections[id];
      const expected=projectedRow?playerStatPoints(projectedRow):null;
      weekly.push({id,actual,expected,diff:expected===null?null:actual-expected,position:pos(id)});
    });
    if(!weekly.length)return;
    const add=(category,p)=>{
      if(!p)return;
      awards.push({week:w,category,player:p.id,team:teamForPlayer(p.id),points:p.actual,diff:p.diff});
    };
    add('Weekly MVP',weekly.slice().sort((a,b)=>b.actual-a.actual)[0]);
    ['QB','RB','WR','TE','K','DEF'].forEach(position=>{
      add(`Top ${position}`,weekly.filter(p=>p.position===position).sort((a,b)=>b.actual-a.actual)[0]);
    });
    add('Best over projection',weekly.filter(p=>p.diff!==null&&p.diff>0).sort((a,b)=>b.diff-a.diff)[0]);
  });
}
function renderHistory(){
  const categories=['Weekly MVP','Top QB','Top RB','Top WR','Top TE','Top K','Top DEF','Best over projection'];
  const byCat={};
  awards.forEach(a=>{(byCat[a.category]??={});(byCat[a.category][a.team]??=[]).push(a);});
  const categoryCards=categories.map(category=>{
    const leaders=Object.entries(byCat[category]||{}).sort((a,b)=>b[1].length-a[1].length).slice(0,3);
    return `<div class="award">
      <div class="award-label">${esc(category)} · top teams</div>
      ${leaders.length?leaders.map(([team,list],i)=>`<details class="tdet"><summary><strong>${i+1}. ${esc(team)}</strong><span class="award-score">${list.length} win${list.length>1?'s':''}</span></summary>${list.slice().sort((a,b)=>b.week-a.week).map(a=>`<div class="tp"><span>Wk ${a.week} · ${esc(playerName(a.player))}</span><span class="muted">${num(a.points)} pts</span></div>`).join('')}</details>`).join(''):'<div class="award-meta">No winners recorded</div>'}
    </div>`;
  }).join('');
  const leaders=getPlayerLeaders();
  const teamLeaders=getTeamExpectedLeaders();
  const lowestTeam=rosters.slice().sort((a,b)=>teamPoints(a)-teamPoints(b))[0];
  const topTeam=rosters.slice().sort((a,b)=>teamPoints(b)-teamPoints(a))[0];
  function leaderCard(label,name,value,detail=''){
    return `<div class="award"><div class="award-label">${esc(label)}</div>
      <strong>${esc(name||'—')}</strong><div class="award-meta">${value}</div>
      ${detail?`<div class="award-meta">${detail}</div>`:''}</div>`;
  }
  const season=league?.season||'Current';
  const seasonCards=[
    leaderCard(`${season} team points leader`,topTeam?teamName(topTeam):'—',topTeam?`${num(teamPoints(topTeam))} points`:'—'),
    leaderCard(`${season} highest-scoring player`,leaders.highest?playerName(leaders.highest):'—',leaders.highest?`${num(seasonPlayerStats[leaders.highest].total)} total points`:'No stats available'),
    leaderCard(`${season} team most over expected`,teamLeaders.over?.name||'—',teamLeaders.over?`+${num(teamLeaders.over.diff)} points`:'No projection data'),
    leaderCard(`${season} player most over expected`,leaders.over?playerName(leaders.over):'—',leaders.over?`+${num(playerOverExpected(leaders.over))} average points vs expected`:'No projection data'),
    leaderCard(`${season} lowest-scoring team`,lowestTeam?teamName(lowestTeam):'—',lowestTeam?`${num(teamPoints(lowestTeam))} points`:'—'),
    leaderCard(`${season} player most under expected`,leaders.under?playerName(leaders.under):'—',leaders.under?`${num(playerOverExpected(leaders.under))} average points vs expected`:'No projection data')
  ].join('');
  const positionRows=['QB','RB','WR','TE','K','DEF'].map(position=>{
    const R=rosteredIds();
    const ids=Object.keys(seasonPlayerStats).filter(id=>R.has(id)&&pos(id)===position&&playerOverExpected(id)!==null);
    const sorted=ids.slice().sort((a,b)=>playerOverExpected(b)-playerOverExpected(a));
    const over=sorted[0],under=sorted[sorted.length-1];
    return `<tr><td><strong>${position}</strong></td>
      <td>${over?`${esc(playerName(over))} <span class="positive">+${num(playerOverExpected(over))}</span>`:'—'}</td>
      <td>${under?`${esc(playerName(under))} <span class="negative">${num(playerOverExpected(under))}</span>`:'—'}</td></tr>`;
  }).join('');
  const filtered=awardFilter==='All'?awards:awards.filter(a=>a.category===awardFilter);
  const history=filtered.slice().sort((a,b)=>b.week-a.week||a.category.localeCompare(b.category));
  $('#view').innerHTML=`
    <section class="panel">
      <div class="panel-head"><h3>${season} season leaders</h3><span class="pill">Season to date</span></div>
      <div class="award-grid">${seasonCards}</div>
    </section>
    <section class="panel">
      <div class="panel-head"><h3>Award category leaders</h3><span class="pill">Top three teams</span></div>
      <div class="award-grid">${categoryCards}</div>
    </section>
    <section class="panel">
      <div class="panel-head"><h3>Points over / under expected by position</h3></div>
      <div class="table-wrap"><table>
        <thead><tr><th>Position</th><th>Most over expected</th><th>Most under expected</th></tr></thead>
        <tbody>${positionRows}</tbody>
      </table></div>
      <p class="small muted">Rostered players only. Difference is average actual fantasy points minus average projected points per game. Players without projection data are excluded.</p>
    </section>
    <section class="panel">
      <div class="panel-head"><h3>Weekly award history</h3>
        <select id="awardFilter">${['All',...categories].map(c=>`<option value="${esc(c)}" ${c===awardFilter?'selected':''}>${esc(c)}</option>`).join('')}</select>
      </div>
      ${history.length?history.map(a=>`
        <div class="history-row">
          <div class="week-tag">Week ${a.week}</div>
          <div><div class="history-player">${esc(playerName(a.player))}</div><div class="history-sub">${esc(a.category)} · ${esc(a.team)}</div></div>
          <div class="award-score">${num(a.points)} pts</div>
        </div>`).join(''):'<div class="empty">No award winners available yet.</div>'}
    </section>`;
  $('#awardFilter').addEventListener('change',e=>{awardFilter=e.target.value;renderHistory();});
}

async function loadSeasonPlayerStats(){
  seasonPlayerStats={};
  const season=league.season;
  const completedWeeks=Math.max(0,curWeek()-1);
  if(!completedWeeks)return;
  const results=await Promise.all(Array.from({length:completedWeeks},(_,i)=>
    getData(`/stats/nfl/${season}/${i+1}?season_type=regular`).catch(()=>({}))
  ));

      const points=playerStatPoints(row);
      seasonPlayerStats[id]??={total:0,games:0,expected:0,projectionGames:0};
      seasonPlayerStats[id].total+=points;
      if(Number(row.gp||0)>0||points!==0)seasonPlayerStats[id].games++;
    });
  });
  // position rank = average points per game played
  const byPosition={};
  Object.entries(seasonPlayerStats).forEach(([id,x])=>{
    const position=pos(id);
    if(position&&x.games>=MIN_GAMES_FOR_RANK)(byPosition[position]??=[]).push({id,avg:x.total/x.games});
  });
  Object.values(byPosition).forEach(list=>{
    list.sort((a,b)=>b.avg-a.avg);
    list.forEach((x,i)=>seasonPlayerStats[x.id].rank=i+1);
  });
}

const TITLES={overview:'League overview',standings:'Standings',power:'Power rankings',luck:'Luck, schedule & lineups',odds:'Playoff odds',report:'Weekly report',

function renderStats(){
  $('#stats').innerHTML=[
    metricCard('Teams',rosters.length),
    metricCard('Completed trades',completedTrades),
    metricCard('Season',league?.season||'—'),
    metricCard('Week',curWeek())
  ].join('');
  if(league&&state&&String(league.season)!==String(state.season))
    $('#errorBox').innerHTML=`<div class="error">This league ID is the ${esc(league.season)} season, but Sleeper's NFL calendar is on ${esc(state.season)}. Live matchup tabs use the current NFL week; history tabs are unaffected.</div>`;
}
function renderTab(){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===activeTab));
  $('#pageTitle').textContent=TITLES[activeTab]||'League hub';
  const live=LIVE_TABS.includes(activeTab);
  $('.week-control').style.display=activeTab==='overview'?'':'none';
  $('#seasonWrap').style.display=live||CROSS_TABS.includes(activeTab)?'none':'';
  Object.keys(CH).forEach(k=>delete CH[k]);
  if(activeTab==='overview')renderOverview();
  else if(activeTab==='awards')renderHistory();
  else renderAnalytic(activeTab);
}
async function renderAnalytic(tab){
  $('#view').innerHTML='<div class="empty"><span class="spin"></span> Loading league history…</div>';
  POST.length=0;
  try{
    const html=await ANALYTIC[tab]();
    if(tab!==activeTab)return;
    $('#view').innerHTML=html;
    mountCharts();
    POST.splice(0).forEach(f=>f());
  }catch(e){
    if(tab===activeTab)$('#view').innerHTML=`<div class="error">Could not build this page: ${esc(e.message)}</div>`;
    console.error(e);
  }
}
async function loadWeek(){
  const [rows]=await Promise.all([get(`/league/${LEAGUE_ID}/matchups/${week}`),loadCurrentWeekData()]);
  matchups=rows||[];
  if(LIVE_TABS.includes(activeTab))renderTab();
}
async function setWeek(value){
  const max=curWeek();
  week=Math.max(1,Math.min(max,Number(value)||1));
  $('#weekSelect').value=String(week);
  $('#liveStatus').textContent='Loading week…';
  try{
    await loadWeek();
    $('#liveStatus').textContent=`Week ${week} · Updated ${new Date().toLocaleTimeString()}`;
  }catch(e){
    $('#errorBox').innerHTML=`<div class="error">Week data could not load: ${esc(e.message)}</div>`;
  }
}
async function refreshAll(){
  $('#liveStatus').textContent='Refreshing live data…';
  $('#errorBox').innerHTML='';
  try{
    const [leagueData,userData,rosterData,stateData]=await Promise.all([
      get(`/league/${LEAGUE_ID}`),get(`/league/${LEAGUE_ID}/users`),get(`/league/${LEAGUE_ID}/rosters`),get('/state/nfl')
    ]);
    league=leagueData;users=userData||[];rosters=rosterData||[];state=stateData;
    $('#leagueMeta').textContent=`${league.name||'Sleeper league'} · ${league.season} season · ${rosters.length} teams · ${LEAGUES.length} seasons of history`;
    $('#seasonLabel').textContent=`NFL ${league.season} · LIVE DATA`;
    const maxWeek=Math.max(1,curWeek());
    if(!initialized){
      week=Math.min(maxWeek,Number(state.display_week||state.week||1));
      initialized=true;
    }else week=Math.min(week,maxWeek);
    $('#weekSelect').innerHTML=Array.from({length:maxWeek},(_,i)=>`<option value="${i+1}">Week ${i+1}</option>`).join('');
    $('#weekSelect').value=String(week);
    await loadPlayers();
    await loadWeek();
    let weekChanged=false;
    if(seasonDataWeek!==curWeek()){
      await Promise.all([loadDraftPicks(),loadTradeCounts(),loadTeamMargins(),loadSeasonPlayerStats()]);
      await loadSeasonProjections();
      await loadAwardHistory();
      weekChanged=seasonDataWeek!==null;
      seasonDataWeek=curWeek();
    }
    // multi-season history loads in the background (past seasons are cached locally)
    if(!histStarted){
      histStarted=true;
      LEAGUES.forEach(id=>loadBundle(id).then(fillSeasonSelect).catch(e=>console.warn('Season failed to load',id,e)));
    }else if(weekChanged)loadBundle(LEAGUE_ID,true).then(fillSeasonSelect).catch(console.warn);
    renderStats();
    if(LIVE_TABS.includes(activeTab))renderTab();
    $('#liveStatus').textContent=`LIVE · Updated ${new Date().toLocaleTimeString()}`;
  }catch(e){
    $('#errorBox').innerHTML=`<div class="error">Dashboard could not load: ${esc(e.message)}. Check the Sleeper API connection.</div>`;
    $('#liveStatus').textContent='Connection error';
    console.error(e);
  }
}

function tradeOK(t){
  const ids=[...new Set(t.rids||[])];
  const got=id=>Object.values(t.adds||{}).filter(r=>r===id).length+(t.picks||[]).filter(p=>p.owner_id===id).length+(t.faab||[]).filter(w=>w.receiver===id&&Number(w.amount)>0).length;
  return ids.length>=2&&ids.filter(id=>got(id)>0).length>=2;
}

function optimalSet(B,pp){
  const slots=(B.league.roster_positions||[]).filter(s=>!['BN','IR','TAXI'].includes(s));
  const pool=Object.entries(pp||{}).map(([id,v])=>({id,v:Number(v)||0,pos:pos(id)})).filter(x=>x.pos).sort((a,b)=>b.v-a.v);
  const used=new Set();let tot=0;
  const take=ok=>{const p=pool.find(x=>!used.has(x.id)&&ok(x.pos));if(p){used.add(p.id);tot+=p.v;}};
  slots.filter(s=>!FLEX[s]).forEach(s=>take(p=>p===s));
  ['WRRB_FLEX','REC_FLEX','FLEX','SUPER_FLEX'].forEach(f=>slots.filter(s=>s===f).forEach(()=>take(FLEX[f])));
  return {tot,used};
}

function donut(ca,cb,finished,none){
  const C=2*Math.PI*38,lead=ca>cb?'a':cb>ca?'b':'';
  const col=s=>none||!lead?'#91a0bb':lead===s?'#45d6a0':'#ff7185';
  const la=C*ca/100,lb=C*cb/100;
  const txt=none?'—':finished?'FINAL':Math.max(ca,cb)+'%';
  return `<div class="donut"><svg viewBox="0 0 100 100" role="img" aria-label="Projected win chance"><circle class="dt" cx="50" cy="50" r="38"/>
    <circle class="da" cx="50" cy="50" r="38" transform="rotate(-90 50 50)" style="stroke:${col('a')};stroke-dasharray:${la} ${C-la}"/>
    <circle class="da" cx="50" cy="50" r="38" transform="rotate(-90 50 50)" style="stroke:${col('b')};stroke-dasharray:${lb} ${C-lb};stroke-dashoffset:${-la}"/>
    <text x="50" y="${finished||none?56:51}" class="dp">${txt}</text>${finished||none?'':'<text x="50" y="66" class="ds">TO WIN</text>'}</svg></div>`;
}

function sideHTML(name,sc,chance,pj,st){
  const cls=st==='win'?'winner':st==='lose'?'loss':'';
  const done=st==='win'||st==='lose';
  return `<div class="match-side"><strong class="${cls}">${esc(name)}</strong><span class="score-line">${num(sc)} pts</span>
    ${done?'':`<span class="pc ${st==='lead'?'pg':st==='trail'?'pr':''}">${chance===null?'Chance —':chance+'% to win'}</span>`}
    <span class="proj2">${done?'':'Proj. '+num(pj)}</span>
    ${st==='win'?'<div class="crown" aria-label="Winner">👑</div>':st==='lose'?'<div class="explosion" aria-label="Defeat">✹</div>':''}</div>`;
}

function seedOrder(P){let a=[1,2];while(a.length<P){const m=a.length*2+1;a=a.flatMap(s=>[s,m-s]);}return a;}

function bracketHTML(rows){
  const n=Math.min(Number(league?.settings?.playoff_teams||6),rows.length);
  if(n<2)return '<div class="empty">No playoff format found.</div>';
  let P=2;while(P<n)P*=2;
  const ord=seedOrder(P);
  const nm=s=>`<span class="sd">${s}</span> ${esc(teamName(rows[s-1].r))} <em>${rows[s-1].wins}-${rows[s-1].losses}</em>`;
  let cur=[];
  for(let i=0;i<P;i+=2){const a=ord[i],b=ord[i+1];cur.push({a,b,bye:a>n?b:b>n?a:0});}
  const rounds=[cur];
  while(cur.length>1){const nx=[];for(let i=0;i<cur.length;i+=2)nx.push({c:[cur[i],cur[i+1]]});rounds.push(nx);cur=nx;}
  const rn=k=>{const left=rounds.length-k;return k===0&&P>n?'Wild card round':left===1?'Final':left===2?'Semifinals':left===3?'Quarterfinals':'Round '+(k+1);};
  const ent=(c,k,j)=>c.bye?nm(c.bye):`<span class="muted">Winner of ${rn(k-1)} ${j+1}</span>`;
  return `<div class="bk">${rounds.map((rd,k)=>`<div class="rd"><h5>${rn(k)}</h5>${rd.map((m,j)=>{
    if(k===0)return m.bye?`<div class="bm"><div>${nm(m.bye)}</div><div class="muted">Bye</div></div>`:`<div class="bm"><div>${nm(m.a)}</div><div>${nm(m.b)}</div></div>`;
    return `<div class="bm"><div>${ent(m.c[0],k,2*j)}</div><div>${ent(m.c[1],k,2*j+1)}</div></div>`;}).join('')}</div>`).join('')}</div>`;
}

function posLeaders(B){
  const dw=analyze(B).dw,S={};
  dw.forEach(w=>(B.W[w-1]||[]).forEach(x=>x.s.forEach(id=>{
    if(!id||id==='0')return;
    const q=S[id]??={n:0,pts:0,rid:x.r};q.n++;q.pts+=x.pp[id]||0;q.rid=x.r;
  })));
  const out={};
  Object.entries(S).forEach(([id,q])=>{
    if(!dw.length||q.n/dw.length<.25)return;
    const p=pos(id);if(!p)return;
    (out[p]??=[]).push({id,avg:q.pts/q.n,n:q.n,rid:q.rid});
  });
  Object.values(out).forEach(a=>a.sort((x,y)=>y.avg-x.avg));
  return {out,dw:dw.length};
}

async function rRosters(){
  const B=await ready(LEAGUE_ID),D=await needAll(),PL=posLeaders(B);
  const lead=['QB','RB','WR','TE','K'].map(p=>{
    const ranked=PL.out[p]||[];
    const best=ranked.slice(0,5);
    const worst=ranked.slice().reverse().slice(0,5);
    const tableRows=(a)=>a.length?tbl(['#','Player','Team','Avg','Started'],a.map((x,i)=>[i+1,`<strong>${esc(playerName(x.id))}</strong>`,N_(B,x.rid),num(x.avg),`${x.n}/${PL.dw}`])):'<div class="empty">No player has been started in 25% of completed weeks yet.</div>';
    return panel(`${p} leaders`,'Top 5 · avg pts when started',tableRows(best))
      +panel(`${p} lowest performers`,'Bottom 5 · avg pts when started',tableRows(worst));
  }).join('');
  const sorted=rosters.slice().sort((a,b)=>teamName(a).localeCompare(teamName(b)));
  const order=['QB','RB','WR','TE','K','DEF'];
  const accs=sorted.map(r=>{
    const c=D.CAR[r.owner_id]||{pts:{},st:{},ro:{},yy:{},bid:null},k=o=>Object.keys(o);
    const top3=k(c.pts).sort((a,b)=>c.pts[b]-c.pts[a]).slice(0,3);
    const lng=k(c.ro).filter(id=>pos(id)!=='DEF').sort((a,b)=>c.ro[b]-c.ro[a])[0];
    const hi=k(c.st).filter(id=>c.st[id]>=4).sort((a,b)=>c.pts[b]/c.st[b]-c.pts[a]/c.st[a])[0];
    const mini=(l,body)=>`<div class="mini"><div class="award-label">${l}</div>${body}</div>`;
    const ids=(r.players||[]).slice().sort((a,b)=>order.indexOf(pos(a))-order.indexOf(pos(b))||playerName(a).localeCompare(playerName(b)));
    const u=users.find(x=>x.user_id===r.owner_id);
    return `<details class="acc"><summary><strong>${esc(teamName(r))}</strong><span class="muted">${esc(u?.display_name||'')} · ${wl(r.settings?.wins||0,r.settings?.losses||0,r.settings?.ties||0)}</span></summary>
      <div class="acc-body"><div class="minis">
        ${mini('Career top scorers (as starters)',top3.length?top3.map((id,i)=>`<div class="tp"><span>${i+1}. ${esc(playerName(id))}</span><span class="muted">${num(c.pts[id])}</span></div>`).join(''):'<div class="muted small">—</div>')}
        ${mini('Longest rostered player',lng?`<strong>${esc(playerName(lng))}</strong><div class="small muted">${c.ro[lng]} weeks · ${c.yy[lng]?c.yy[lng].size:1} season${c.yy[lng]&&c.yy[lng].size>1?'s':''}</div>`:'—')}
        ${mini('Best points / week (min 4 starts)',hi?`<strong>${esc(playerName(hi))}</strong><div class="small muted">${num(c.pts[hi]/c.st[hi])} pts/wk as a starter</div>`:'—')}
        ${mini('Biggest FAAB purchase',c.bid?`<strong>$${c.bid.v}</strong><div class="small muted">${esc(playerName(c.bid.pid))} · ${c.bid.yr}</div>`:'<div class="muted small">No FAAB bids</div>')}
      </div>
      <div class="table-wrap"><table><thead><tr><th>Player</th><th>Pos</th><th>Weekly avg</th><th>Pos rank</th><th>Draft pick</th></tr></thead>
      <tbody>${ids.map(id=>{const x=seasonPlayerStats[id]||{};return `<tr><td><strong>${esc(playerName(id))}</strong></td><td>${esc(pos(id)||'—')}</td><td>${x.games?num(x.total/x.games):'—'}</td><td>${x.rank?'#'+x.rank:'—'}</td><td>${esc(draftPickByPlayer[id]||'Undrafted')}</td></tr>`;}).join('')}</tbody></table></div></div></details>`;
  }).join('');
  const metricNote='<p class="small muted">Only QB, RB, WR, TE, and K are included; defenses are excluded. Eligibility: a player must have been in a starting lineup in at least 25% of the completed weeks analyzed. Average points per start = the player’s total fantasy points in those starting weeks ÷ the number of weeks started. Leaders are ranked from highest to lowest average; lowest performers are ranked from lowest to highest. Each list shows up to five eligible players.</p>';
  return `<div class="grid2">${lead}</div>`+panel('How these metrics are calculated','',metricNote)+panel('Rosters','Tap a team to expand',accs,'Career stats count every season in this league under that manager, using points while the player was in the starting lineup.');

function pickupHTML(B,w){
  const row=rid=>(B.W[w-1]||[]).find(x=>x.r===rid),c={};
  B.tx.filter(t=>(t.type==='waiver'||t.type==='free_agent')&&t.leg===w).forEach(t=>Object.entries(t.adds||{}).forEach(([pid,rid])=>{
    const x=row(rid),p=x?.pp[pid];
    const still=(B.rosters.find(r=>r.roster_id===rid)?.players||[]).includes(pid);
    if(p!=null&&still&&(!c[pid+rid]||p>c[pid+rid].p))c[pid+rid]={pid,rid,p,st:x.s.includes(pid),bid:t.type==='waiver'?t.bid:0};
  }));
  const a=Object.values(c).sort((x,y)=>y.p-x.p);
  if(!a.length)return panel('Pickup of the week',`Week ${w}`,'<div class="empty">No qualifying pickups this week.</div>');
  const b=a[0];
  return panel('Pickup of the week',`Week ${w}`,
    `<div class="banner">🔥 <strong>${esc(playerName(b.pid))}</strong> <span class="muted">${esc(pos(b.pid))}</span> scored <strong>${num(b.p)}</strong> for ${N_(B,b.rid)} after being picked up (${b.bid?'$'+b.bid+' FAAB':'free agent'}) — ${b.st?'in the starting lineup':'on the bench'}.</div>`
    +tbl(['Player','Team','Pts','Cost','Role'],a.slice(0,5).map(x=>[`<strong>${esc(playerName(x.pid))}</strong> <em class="muted">${esc(pos(x.pid))}</em>`,N_(B,x.rid),num(x.p),x.bid?'$'+x.bid:'FA',x.st?'Started':'Bench'])),
    'Best score from a player added during this week (waiver or free agent) who is still on that roster.');
}
