<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>WE THE PEOPLE LEAGUE HUB</title>
    <style>
    :root {
        --bg: #0b1020;
        --panel: #121a2c;
        --panel2: #182238;
        --line: #27334b;
        --text: #edf2ff;
        --muted: #91a0bb;
        --accent: #8b7cff;
        --green: #45d6a0;
        --red: #ff7185;
        --gold: #f4c76b
    }

    * {
        box-sizing: border-box
    }

    body {
        margin: 0;
        background: radial-gradient(ellipse at 20% -10%, #25214c 0, transparent 40%), var(--bg);
        color: var(--text);
        font: 14px/1.45 system-ui, -apple-system, Segoe UI, Roboto, Arial
    }

    header {
        padding: 22px max(18px, calc((100vw - 1200px) /2));
        border-bottom: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        gap: 18px;
        align-items: center;
        flex-wrap: wrap
    }

    .brand {
        display: flex;
        align-items: center;
        gap: 12px
    }

    .mark {
        width: 42px;
        height: 42px;
        border-radius: 13px;
        background: linear-gradient(135deg, #8b7cff, #40c9b4);
        display: grid;
        place-items: center;
        font-weight: 900;
        font-size: 20px;
        color: #090d19
    }

    .eyebrow {
        color: var(--muted);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1.6px
    }

    .brand h1 {
        font-size: 19px;
        margin: 2px 0 0
    }

    .actions {
        display: flex;
        gap: 9px;
        align-items: center;
        flex-wrap: wrap
    }

    .status {
        color: var(--muted);
        font-size: 12px
    }

    .live-dot {
        display: inline-block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--green);
        margin-right: 6px;
        box-shadow: 0 0 10px #45d6a0
    }

    button, select {
        background: var(--panel2);
        border: 1px solid var(--line);
        color: var(--text);
        border-radius: 9px;
        padding: 9px 12px;
        font: inherit
    }

    button {
        cursor: pointer
    }

    button:hover {
        border-color: var(--accent)
    }

    button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: white;
        font-weight: 700
    }

    main {
        max-width: 1240px;
        margin: 0 auto;
        padding: 24px 18px 60px
    }

    .hero {
        display: flex;
        justify-content: space-between;
        align-items: end;
        gap: 16px;
        margin-bottom: 18px;
        flex-wrap: wrap
    }

    .hero h2 {
        font-size: 26px;
        margin: 0
    }

    .hero p {
        color: var(--muted);
        margin: 5px 0 0
    }

    .week-control {
        display: flex;
        gap: 8px;
        align-items: center
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
        margin: 16px 0
    }

    .stat, .panel {
        background: linear-gradient(180deg, rgba(24, 34, 56, .96), rgba(18, 26, 44, .96));
        border: 1px solid var(--line);
        border-radius: 15px
    }

    .stat {
        padding: 16px
    }

    .stat .label {
        color: var(--muted);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1px
    }

    .stat .value {
        font-size: 27px;
        font-weight: 800;
        margin-top: 6px
    }

    .stat .sub {
        color: var(--muted);
        font-size: 12px;
        margin-top: 2px
    }

    .tabs {
        display: flex;
        gap: 6px;
        overflow: auto;
        padding: 4px 0 14px
    }

    .tab {
        white-space: nowrap;
        color: var(--muted);
        background: transparent
    }

    .tab.active {
        color: white;
        background: var(--panel2);
        border-color: #514a91
    }

    .panel {
        padding: 17px;
        margin-bottom: 14px;
        min-width: 0
    }

    .panel-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 13px
    }

    .panel h3 {
        margin: 0;
        font-size: 15px
    }

    .muted {
        color: var(--muted)
    }

    .small {
        font-size: 12px
    }

    .overview-columns {
        display: grid;
        grid-template-columns: minmax(0, 1.12fr) minmax(300px, .88fr);
        gap: 12px;
        align-items: start
    }

    .overview-columns .panel {
        padding: 14px
    }

    .match {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 170px minmax(0, 1fr);
        gap: 8px;
        align-items: center;
        padding: 13px 0;
        border-bottom: 1px solid var(--line);
        max-width: 100%;
        margin: 0 auto
    }

    .match:last-child {
        border: 0
    }

    .match-side {
        min-width: 0
    }

    .match-side strong {
        display: block;
        overflow-wrap: anywhere;
        font-size: 12px
    }

    .match-side span {
        display: block;
        color: var(--muted);
        font-size: 11px
    }

    .match-side:last-child {
        text-align: right
    }

    .match-side .score-line {
        font-size: 15px;
        font-weight: 800;
        color: var(--text)
    }

    .match-side .winner {
        color: var(--green) !important
    }

    .match-side .winner:after {
        content: " ▲";
        font-size: 10px
    }

    .match-side .loss {
        color: #ffbd72 !important;
        text-shadow: 0 0 4px #ff4c1e, 0 0 10px #ff7a1a, 0 -4px 13px #ffb52e
    }

    .proj {
        display: block;
        color: var(--gold) !important;
        font-size: 11px !important;
        margin-top: 3px
    }

    .dynamite {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 38px minmax(0, 1fr);
        align-items: center;
        gap: 0;
        width: 100%;
        height: 54px;
        position: relative
    }

    .dynamite-sticks {
        position: relative;
        z-index: 3;
        font-size: 31px;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        transform: rotate(90deg);
        filter: drop-shadow(0 2px 4px #000b);
        width: 38px;
        height: 40px
    }

    .fuse-track {
        height: 5px;
        width: 100%;
        position: relative;
        overflow: visible;
        border: 0;
        background: transparent;
        min-width: 0
    }

    .fuse-track:before {
        content: "";
        position: absolute;
        top: 0;
        height: 5px;
        width: calc(var(--chance) * 1%);
        min-width: 3px;
        background: var(--fuse-color);
        border-radius: 99px;
        box-shadow: 0 0 8px var(--fuse-color)
    }

    .fuse-left:before {
        right: 0
    }

    .fuse-right:before {
        left: 0
    }

    .fuse-spark {
        position: absolute;
        top: 50%;
        width: 8px;
        height: 8px;
        transform: translateY(-50%);
        border-radius: 50%;
        background: #fff7b0;
        box-shadow: 0 0 5px 3px #ff9d36, 0 0 12px 5px #ff5b36;
        z-index: 2
    }

    .fuse-left .fuse-spark {
        right: calc(var(--chance) * 1% - 4px)
    }

    .fuse-right .fuse-spark {
        left: calc(var(--chance) * 1% - 4px)
    }

    .fuse-label {
        position: absolute;
        top: 39px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 8px;
        color: var(--muted);
        white-space: nowrap
    }

    .explosion {
        font-size: 29px;
        line-height: 1;
        color: #ff9c35;
        text-shadow: 0 0 5px #ff5a22, 0 0 14px #ffb12e;
        filter: drop-shadow(0 0 7px #ff8c27);
        animation: boom-pop .28s cubic-bezier(.2, .8, .25, 1) both;
        transform-origin: center
    }

    @keyframes boom-pop {
        0% {
            transform: scale(.15);
            opacity:0
        }

        65% {
            transform: scale(1.28);
            opacity:1
        }

        100% {
            transform: scale(1);
            opacity: 1
        }
    }

    .table-wrap {
        overflow: auto
    }

    table {
        width: 100%;
        border-collapse: collapse;
        min-width: 560px
    }

    th, td {
        text-align: left;
        padding: 11px 9px;
        border-bottom: 1px solid var(--line)
    }

    th {
        font-size: 10px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: 600
    }

    td {
        font-size: 13px
    }

    tr:last-child td {
        border: 0
    }

    .positive {
        color: var(--green)
    }

    .negative {
        color: var(--red)
    }

    .tx {
        display: flex;
        justify-content: space-between;
        gap: 14px;
        padding: 12px 0;
        border-bottom: 1px solid var(--line)
    }

    .award-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px
    }

    .award {
        background: var(--panel2);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 13px;
        min-width: 0
    }

    .award .award-label {
        color: var(--muted);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1px
    }

    .award strong {
        display: block;
        margin: 5px 0;
        font-size: 15px
    }

    .award-meta {
        color: var(--muted);
        font-size: 12px
    }

    .history-row {
        display: grid;
        grid-template-columns: 70px 1fr auto;
        gap: 12px;
        align-items: center;
        padding: 12px 0;
        border-bottom: 1px solid var(--line)
    }

    .history-row:last-child {
        border: 0
    }

    .week-tag {
        color: var(--muted);
        font-size: 12px
    }

    .history-player {
        font-weight: 700
    }

    .history-sub {
        font-size: 12px;
        color: var(--muted)
    }

    .award-score {
        font-weight: 800;
        color: var(--gold)
    }

    .pill {
        border: 1px solid var(--line);
        padding: 3px 7px;
        border-radius: 99px;
        color: var(--muted);
        font-size: 11px
    }

    .empty {
        color: var(--muted);
        padding: 24px;
        text-align: center
    }

    .error {
        color: var(--red);
        background: #311c2a;
        border: 1px solid #673449;
        border-radius: 10px;
        padding: 12px;
        margin: 12px 0
    }

    .footer {
        color: var(--muted);
        font-size: 11px;
        text-align: center;
        margin-top: 22px
    }

    .trade {
        border: 1px solid var(--line);
        border-radius: 13px;
        background: var(--panel2);
        padding: 13px;
        margin-bottom: 10px
    }

    .trade-head {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 10px;
        align-items: center
    }

    .trade-sides {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 10px
    }

    .tside {
        background: rgba(0, 0, 0, .18);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 11px;
        min-width: 0
    }

    .tside.win {
        border-color: var(--green)
    }

    .tside h4 {
        margin: 0 0 4px;
        font-size: 14px;
        display: flex;
        justify-content: space-between;
        gap: 8px
    }

    .tp {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font-size: 12px;
        padding: 3px 0
    }

    .tp em {
        color: var(--muted);
        font-style: normal;
        font-size: 10px
    }

    .tlabel {
        color: var(--muted);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-top: 9px
    }

    .net {
        font-size: 20px;
        font-weight: 800;
        margin-top: 8px
    }

    .tdet {
        border-bottom:1px solid var(--line)
    }

    .tdet:last-child {
        border:0
    }

    .tdet summary {
        display: flex;
        justify-content: space-between;
        gap: 14px;
        padding: 10px 0;
        cursor: pointer;
        list-style:none
    }

    .tdet summary::-webkit-details-marker {
        display:none
    }

    .tdet summary:before {
        content: "▸";
        color: var(--muted);
        margin-right:6px
    }

    .tdet[open] summary:before {
        content: "▾"
    }

    .tdet summary strong {
        flex:1
    }

    .tdet .tp {
        padding:3px 0 3px 16px
    }

    .tdet[open] {
        padding-bottom: 8px
    }

    @media (max-width: 900px) {
        .overview-columns {
            grid-template-columns: 1fr
        }
    }

    @media (max-width: 800px) {
        .grid {
            grid-template-columns:repeat(2, minmax(0, 1fr))
        }

        .award-grid {
            grid-template-columns: repeat(2, minmax(0, 1fr))
        }
    }

    @media (max-width: 520px) {
        header {
            padding:16px
        }

        .grid {
            gap:8px
        }

        .stat {
            padding:12px
        }

        .stat .value {
            font-size:23px
        }

        .hero h2 {
            font-size:22px
        }

        .match {
            grid-template-columns: minmax(0, 1fr) 100px minmax(0, 1fr);
            gap:5px
        }

        .dynamite {
            grid-template-columns:minmax(0, 1fr) 30px minmax(0, 1fr)
        }

        .dynamite-sticks {
            font-size: 24px;
            width:30px
        }

        .award-grid {
            grid-template-columns: 1fr
        }
    }
    </style>
</head>
<body>
    <header>
        <div class="brand">
            <div class="mark">W</div>
            <div>
                <div class="eyebrow">Fantasy football</div>
                <h1>WE THE PEOPLE LEAGUE HUB</h1>
            </div>
        </div>
        <div class="actions">
            <span class="status">
                <i class="live-dot"></i>
                <span id="liveStatus">Connecting…</span>
            </span>
            <button id="refreshBtn" class="primary">↻ Refresh now</button>
        </div>
    </header>
    <main>
        <div class="hero">
            <div>
                <div class="eyebrow" id="seasonLabel">NFL · LIVE DATA</div>
                <h2 id="pageTitle">League overview</h2>
                <p id="leagueMeta">Loading league information…</p>
            </div>
            <div class="week-control">
                <button id="prevWeek">‹</button>
                <label class="small muted" for="weekSelect">WEEK</label>
                <select id="weekSelect"></select>
                <button id="nextWeek">›</button>
            </div>
        </div>
        <div id="errorBox"></div>
        <div class="grid" id="stats"></div>
        <nav class="tabs">
            <button class="tab active" data-tab="overview">Overview</button>
            <button class="tab" data-tab="standings">Standings</button>
            <button class="tab" data-tab="matchups">Matchups</button>
            <button class="tab" data-tab="trades">Trade center</button>
            <button class="tab" data-tab="rosters">Rosters</button>
            <button class="tab" data-tab="history">Player history & awards</button>
        </nav>
        <div id="view"></div>
        <div class="footer">WE THE PEOPLE LEAGUE HUB · Sleeper data · Auto-refreshes every 60 seconds</div>
    </main>
    <script>
    const LEAGUE_ID = '1322960728918888448';
    const API = 'https://api.sleeper.app/v1';
    const DATA_API = 'https://api.sleeper.com';
    const POS_Q = ['QB', 'RB', 'WR', 'TE', 'K', 'DEF'].map(p => `position[]=${p}`).join('&');
    const MIN_GAMES_FOR_RANK = 1; // raise (e.g. 4) to keep one-game wonders off the position-rank board
    const $ = s => document.querySelector(s);
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
    }[c]));
    const num = n => Number(n || 0).toLocaleString(undefined, {
        maximumFractionDigits: 2
    });
    const sgn = n => (n > 0 ? '+' : '') + num(n);

    let league,
        users = [],
        rosters = [],
        state,
        matchups = [],
        players = {},
        week = 1,
        activeTab = 'overview';
    let completedTrades = 0,
        teamTradeCounts = {},
        faabTraded = {},
        tradeLog = [],
        weeklyPts = {},
        tradeSort = 'lopsided';
    let seasonPlayerStats = {},
        draftPickByPlayer = {},
        teamMargins = {},
        awards = [],
        awardFilter = 'All';
    let currentProjections = {},
        currentWeekStats = {},
        currentSchedule = [];
    let initialized = false,
        seasonDataWeek = null;

    /* ---------- data access ---------- */
    async function get(path) {
        const r = await fetch(API + path);
        if (!r.ok)
            throw new Error(`${r.status} ${path}`);
        return r.json();
    }
    async function getData(path) {
        const go = async p => {
            const r = await fetch(DATA_API + p);
            if (!r.ok)
                throw new Error(`${r.status} ${p}`);
            return r.json();
        };
        if (/^\/(projections|stats)\/nfl\//.test(path)) {
            try {
                const d = await go(`${path}&${POS_Q}`);
                if (Array.isArray(d) ? d.length : Object.keys(d || {}).length)
                    return d;
            } catch (e) {}
        }
        return go(path);
    }
    function normalizeRows(data) {
        const out = {};
        const put = (id, item) => {
            if (!id)
                return;
            out[id] = {
                ...(item?.stats || item || {}),
                __game_id: item?.game_id,
                __team: item?.team
            };
        };
        if (Array.isArray(data))
            data.forEach(it => put(String(it.player_id ?? it.playerId ?? it.id ?? it.player?.player_id ?? ''), it));
        else if (data && typeof data === 'object')
            Object.entries(data).forEach(([id, it]) => put(String(id), it));
        return out;
    }

    /* ---------- helpers ---------- */
    const curWeek = () => Number(state?.week || week);
    function owner(rosterId) {
        const r = rosters.find(x => x.roster_id === rosterId);
        return users.find(x => x.user_id === r?.owner_id);
    }
    function teamName(roster) {
        const u = owner(roster.roster_id);
        return u?.metadata?.team_name || u?.display_name || `Team ${roster.roster_id}`;
    }
    function rosterName(id) {
        return teamName(rosters.find(r => r.roster_id === id) || {
            roster_id: id
        });
    }
    function playerName(id) {
        const p = players[id] || {};
        return p.full_name || [p.first_name, p.last_name].filter(Boolean).join(' ') || id;
    }
    function pos(id) {
        return players[id]?.position || '';
    }
    function score(m) {
        return Number(m?.points ?? m?.settings?.fpts ?? 0);
    }
    function fantasyPts(row) {
        const rec = Number(league?.scoring_settings?.rec ?? 0);
        if (rec >= 1)
            return Number(row?.pts_ppr ?? row?.pts ?? 0);
        if (rec > 0)
            return Number(row?.pts_half_ppr ?? row?.pts ?? 0);
        return Number(row?.pts_std ?? row?.pts ?? 0);
    }
    const projectionPoints = row => fantasyPts(row || {});
    const playerStatPoints = row => fantasyPts(row);
    const playerActualPoints = id => fantasyPts(currentWeekStats[id] || {});
    const starters = m => (m?.starters || []).filter(id => id && id !== '0').map(String);
    function playerHasStarted(id) {
        const row = currentWeekStats[String(id)];
        return !!row && (Number(row.gp || 0) > 0 || Number(row.gs || 0) > 0);
    }
    function pf(r, k='fpts') {
        return Number(r.settings?.[k] || 0) + Number(r.settings?.[k + '_decimal'] || 0) / 100;
    }
    const teamPoints = r => pf(r);
    function faabSpent(r) {
        const u = r.settings?.waiver_budget_used;
        return u === undefined || u === null ? null : Number(u);
    }
    function metricCard(label, value, sub='') {
        return `<div class="stat"><div class="label">${label}</div><div class="value">${value}</div><div class="sub">${sub}</div></div>`;
    }
    function groupMatchups(rows) {
        const groups = {};
        (rows || []).forEach(m => {
            const id = m.matchup_id ?? `bye-${m.roster_id}`;
            (groups[id] ??= []).push(m);
        });
        return Object.values(groups).filter(g => g.length > 1);
    }
    const groupsForRoster = id => groupMatchups(matchups).find(g => g.some(m => m.roster_id === id));

    /* ---------- ONE projection model ----------
       projected final = live matchup score + points still to come from starters
       whose NFL game isn't finished. Win chance, fuses, "Projected final" and
       projected standings all read from this same number. */
    function projectionsAvailable() {
        return Object.keys(currentProjections).length > 0;
    }
    function projFor(id) {
        const row = currentProjections[id];
        if (row)
            return projectionPoints(row);
        if (projectionsAvailable())
            return 0;
        const x = seasonPlayerStats[id];
        return x?.games ? x.total / x.games : 0;
    }
    function gameStatusForPlayer(id) {
        const p = players[id] || {},
            pr = currentProjections[id] || {};
        const games = (currentSchedule || []).filter(g => Number(g.week) === Number(week));
        const gid = String(pr.__game_id ?? '');
        if (gid) {
            const g = games.find(x => String(x.game_id) === gid);
            if (g)
                return g.status || 'pre_game';
        }
        const team = p.team || pr.__team;
        if (team && games.length) {
            const g = games.find(x => x.home === team || x.away === team);
            return g ? (g.status || 'pre_game') : 'bye';
        }
        return playerHasStarted(id) ? 'in_game' : 'pre_game';
    }
    function remainingFor(id) {
        const st = gameStatusForPlayer(id);
        if (st === 'complete' || st === 'canceled' || st === 'bye')
            return 0;
        const proj = projFor(id);
        return st === 'in_game' ? Math.max(0, proj - playerActualPoints(id)) : Math.max(0, proj);
    }
    const remainingProjection = m => starters(m).reduce((s, id) => s + remainingFor(id), 0);
    function teamProjection(m) {
        if (week < curWeek())
            return score(m);
        return score(m) + remainingProjection(m);
    }
    const remainingVariance = m => starters(m).reduce((s, id) => s + Math.pow(remainingFor(id) * .42, 2), 0);
    function matchupFinished(a, b) {
        if (week < curWeek())
            return true;
        const ids = [...starters(a), ...starters(b)];
        return ids.length > 0 && ids.every(id => ['complete', 'canceled', 'bye'].includes(gameStatusForPlayer(id)));
    }
    function erf(x) {
        const sign = x < 0 ? -1 : 1;
        x = Math.abs(x);
        const t = 1 / (1 + .3275911 * x);
        const y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - .284496736) * t + .254829592) * t * Math.exp(-x * x);
        return sign * y;
    }
    const normalCdf = x => .5 * (1 + erf(x / Math.sqrt(2)));
    function winChance(a, b) {
        const sa = score(a),
            sb = score(b);
        if (matchupFinished(a, b))
            return sa > sb ? 100 : sa < sb ? 0 : 50;
        if (!starters(a).length || !starters(b).length)
            return null;
        const margin = teamProjection(a) - teamProjection(b);
        const sd = Math.sqrt(remainingVariance(a) + remainingVariance(b));
        if (sd < 1)
            return margin > 0 ? 99 : margin < 0 ? 1 : 50;
        return Math.max(1, Math.min(99, Math.round(normalCdf(margin / sd) * 100)));
    }
    function fuseColor(chance) {
        const hue = Math.max(0, Math.min(120, Number(chance) || 0));
        return `hsl(${hue},85%,48%)`;
    }

    /* ---------- matchups ---------- */
    function matchupHTML(groups) {
        if (!groups.length)
            return '<div class="empty">No matchups available.</div>';
        return groups.map(g => {
            const a = g[0],
                b = g[1];
            const sa = score(a),
                sb = score(b);
            const pa = teamProjection(a),
                pb = teamProjection(b);
            const finished = matchupFinished(a, b);
            let ca = winChance(a, b);
            let cb = ca === null ? null : 100 - ca;
            const chanceA = ca === null ? 50 : ca;
            const chanceB = cb === null ? 50 : cb;
            const winnerA = finished ? sa > sb : chanceA > chanceB;
            const winnerB = finished ? sb > sa : chanceB > chanceA;
            const loserA = finished && sa < sb;
            const loserB = finished && sb < sa;
            const nameA = rosterName(a.roster_id),
                nameB = rosterName(b.roster_id);
            return `<div class="match">
                  <div class="match-side">
                    <strong class="${winnerA ? 'winner' : ''} ${loserA ? 'loss' : ''}">${esc(nameA)}</strong>
                    <span class="score-line">${num(sa)} pts</span>
                    <span class="proj">${ca === null ? 'Chance —' : chanceA + '% to win'}</span>
                    <span class="proj">Projected final ${num(pa)}</span>
                    ${loserA ? '<div class="explosion" aria-label="Defeat">✹</div>' : ''}
                  </div>
                  <div class="dynamite">
                    <div class="fuse-track fuse-left" style="--chance:${chanceA};--fuse-color:${fuseColor(chanceA)}">${finished ? '' : '<i class="fuse-spark"></i>'}</div>
                    <div class="dynamite-sticks">🧨</div>
                    <div class="fuse-track fuse-right" style="--chance:${chanceB};--fuse-color:${fuseColor(chanceB)}">${finished ? '' : '<i class="fuse-spark"></i>'}</div>
                    <div class="fuse-label">${finished ? 'FINAL' : 'LIVE WIN CHANCE'}</div>
                  </div>
                  <div class="match-side">
                    <strong class="${winnerB ? 'winner' : ''} ${loserB ? 'loss' : ''}">${esc(nameB)}</strong>
                    <span class="score-line">${num(sb)} pts</span>
                    <span class="proj">${cb === null ? 'Chance —' : chanceB + '% to win'}</span>
                    <span class="proj">Projected final ${num(pb)}</span>
                    ${loserB ? '<div class="explosion" aria-label="Defeat">✹</div>' : ''}
                  </div>
                </div>`;
        }).join('');
    }

    /* ---------- standings ---------- */
    function renderStandingsTable(list) {
        const rows = list.slice().sort((a, b) => Number(b.settings?.wins || 0) - Number(a.settings?.wins || 0) || pf(b) - pf(a));

            <th>Avg win margin</th><th>Avg loss margin</th><th>Trades</th><th>FAB spent</th><th>Waiver</th></tr></thead>
            <tbody>${rows.map((r, i) => {const m = teamMargins[r.roster_id] || {win: [],loss: []};const avgWin = m.win.length ? m.win.reduce((a, b) => a + b, 0) / m.win.length : null;const avgLoss = m.loss.length ? m.loss.reduce((a, b) => a + b, 0) / m.loss.length : null;const fab = faabSpent(r);return `<tr>
                    <td>${i + 1}</td><td><strong>${esc(teamName(r))}</strong></td>

                    <td>${num(pf(r))}</td><td>${num(pf(r, 'fpts_against'))}</td>
                    <td class="positive">${avgWin === null ? '—' : num(avgWin)}</td>
                    <td class="negative">${avgLoss === null ? '—' : num(avgLoss)}</td>
                    <td>${teamTradeCounts[r.roster_id] || 0}</td>
                    <td>${fab === null ? '—' : '$' + num(fab)}</td>
                    <td>${r.settings?.waiver_position ?? '—'}</td>
                  </tr>`;}).join('')}</tbody></table></div>`;
    }
    function renderProjectedStandings() {
        const s = league?.settings || {};
        const start = Number(s.start_week || 1),
            po = Number(s.playoff_week_start || 0);
        if (po && week >= po)
            return '<div class="empty">Regular season is over — no projected standings.</div>';
        const base = rosters.map(r => ({
            r,
            wins: Number(r.settings?.wins || 0),
            losses: Number(r.settings?.losses || 0),
            ties: Number(r.settings?.ties || 0),
            points: pf(r)
        }));
        const cmp = (a, b) => b.wins - a.wins || b.points - a.points;
        const now = {};
        base.slice().sort(cmp).forEach((x, i) => now[x.r.roster_id] = i + 1);
        const rows = base.map(x => {
            const y = {
                ...x
            };
            const counted = (x.wins + x.losses + x.ties) >= week - start + 1; // Sleeper already booked this week
            const g = groupsForRoster(x.r.roster_id);
            const own = g?.find(m => m.roster_id === x.r.roster_id),
                opp = g?.find(m => m.roster_id !== x.r.roster_id);
            if (counted || !own || !opp)
                return y;
            const fin = matchupFinished(own, opp);
            if (!fin && !projectionsAvailable() && score(own) + score(opp) === 0)
                return y;
            const a = teamProjection(own),
                b = teamProjection(opp);
            y.points += a;
            if (Math.abs(a - b) < 0.005)
                y.ties++;
            else if (a > b)
                y.wins++;
            else
                y.losses++;
            return y;
        }).sort(cmp);
        return `<div class="table-wrap"><table>
            <thead><tr><th>#</th><th>Team</th><th>Now</th><th>Projected W-L</th><th>Proj PF</th></tr></thead>
            <tbody>${rows.map((x, i) => {const d = now[x.r.roster_id] - (i + 1);const mv = d > 0 ? `<span class="positive">▲${d}</span>` : d < 0 ? `<span class="negative">▼${-d}</span>` : '<span class="muted">–</span>';return `<tr><td>${i + 1}</td><td><strong>${esc(teamName(x.r))}</strong></td><td>#${now[x.r.roster_id]} ${mv}</td>
                    <td>${x.wins}-${x.losses}${x.ties ? '-' + x.ties : ''}</td><td>${num(x.points)}</td></tr>`;}).join('')}</tbody></table></div>`;
    }

    /* ---------- trade center ----------
       For each team in a trade: net pts/wk = avg weekly points of the players it
       RECEIVED minus avg weekly points of the players it SENT, over every
       completed week after the trade. Raw player points (not starters-only);
       picks and FAAB are listed but not scored. */
    function tradeAnalysis() {
        const done = Math.max(0, curWeek() - 1);
        return tradeLog.map(t => {
            const weeks = [];
            for (let w = Number(t.leg || 0) + 1; w <= done; w++)
                weeks.push(w);
            const n = weeks.length;
            const avg = id => n ? weeks.reduce((a, w) => a + (weeklyPts[w]?.[id] || 0), 0) / n : null;
            const rids = [...new Set(t.roster_ids || [])];
            const sides = rids.map(rid => {
                const got = Object.entries(t.adds || {}).filter(([, r]) => r === rid).map(([p]) => p);
                const sent = Object.entries(t.drops || {}).filter(([, r]) => r === rid).map(([p]) => p);
                const gotAvg = got.reduce((s, id) => s + (avg(id) || 0), 0),
                    sentAvg = sent.reduce((s, id) => s + (avg(id) || 0), 0);
                return {
                    rid,
                    got,
                    sent,
                    net: n ? gotAvg - sentAvg : null,
                    netTotal: n ? (gotAvg - sentAvg) * n : 0,
                    picksIn: (t.draft_picks || []).filter(p => p.owner_id === rid),
                    picksOut: (t.draft_picks || []).filter(p => p.previous_owner_id === rid),
                    faab: (t.waiver_budget || []).reduce((s, w) => s + (w.receiver === rid ? Number(w.amount || 0) : 0) - (w.sender === rid ? Number(w.amount || 0) : 0), 0)
                };
            });
            const nets = sides.map(s => s.net).filter(v => v !== null);
            return {
                t,
                n,
                avg,
                sides,
                best: nets.length ? Math.max(...nets) : -1e9,
                spread: nets.length ? Math.max(...nets) - Math.min(...nets) : -1e9
            };
        });
    }
    function pickLabel(p) {
        const via = p.roster_id && p.roster_id !== p.previous_owner_id ? ` (${esc(rosterName(p.roster_id))})` : '';
        return `${esc(p.season)} Rd ${esc(p.round)}${via}`;
    }
    function tradeCardHTML(a, rank) {
        const {t, n, avg, sides} = a;
        const date = t.created ? new Date(t.created).toLocaleDateString(undefined, {
            month: 'short',
            day: 'numeric',
            year: 'numeric'
        }) : '';
        const top = n ? Math.max(...sides.map(s => s.net)) : null;
        const multiWinner = n && sides.length > 1 && sides.filter(s => Math.abs(s.net - top) < 0.005).length === 1;
        const pl = ids => ids.length ? ids.map(id => `<div class="tp"><span>${esc(playerName(id))} <em>${esc(pos(id))}</em></span><span class="muted">${n ? num(avg(id)) + '/wk' : '—'}</span></div>`).join('') : '<div class="tp muted">—</div>';
        const extras = (label, picks, faab) => (picks.length || faab) ? `<div class="tlabel">${label}</div>${picks.map(p => `<div class="tp"><span>${pickLabel(p)}</span></div>`).join('')}${faab ? `<div class="tp"><span>$${num(Math.abs(faab))} FAAB</span></div>` : ''}` : '';
        return `<div class="trade">
            <div class="trade-head"><strong>${rank ? '#' + rank + ' · ' : ''}Week ${Number(t.leg) || '—'} trade</strong>
              <span class="small muted">${esc(date)} · ${n ? `${n} week${n > 1 ? 's' : ''} of results` : 'Too new — no completed weeks yet'}</span></div>
            <div class="trade-sides">${sides.map(s => {const win = multiWinner && Math.abs(s.net - top) < 0.005;return `<div class="tside ${win ? 'win' : ''}">
                    <h4><span>${esc(rosterName(s.rid))}</span>${win ? '<span class="positive">WINNER</span>' : ''}</h4>
                    <div class="tlabel">Received</div>${pl(s.got)}
                    ${extras('Picks / FAAB received', s.picksIn, s.faab > 0 ? s.faab : 0)}
                    <div class="tlabel">Sent</div>${pl(s.sent)}
                    ${extras('Picks / FAAB sent', s.picksOut, s.faab < 0 ? s.faab : 0)}
                    <div class="net ${s.net === null ? 'muted' : s.net >= 0 ? 'positive' : 'negative'}">${s.net === null ? '—' : sgn(s.net) + ' pts/wk'}</div>
                    ${s.net === null ? '' : `<div class="small muted">${sgn(s.netTotal)} total since the trade</div>`}
                  </div>`;}).join('')}</div>
          </div>`;
    }
    function renderTradeCenter() {
        const A = tradeAnalysis();
        if (!A.length) {
            $('#view').innerHTML = '<section class="panel"><div class="empty">No completed trades found for this league.</div></section>';
            return;
        }
        const T = {};
        rosters.forEach(r => T[r.roster_id] = {
            r,
            trades: 0,
            net: 0,
            total: 0,
            wins: 0
        });
        A.forEach(a => {
            const top = a.n ? Math.max(...a.sides.map(s => s.net)) : null;
            a.sides.forEach(s => {
                const x = T[s.rid];
                if (!x)
                    return;
                x.trades++;
                if (a.n) {
                    x.net += s.net;
                    x.total += s.netTotal;
                    if (a.sides.length > 1 && Math.abs(s.net - top) < 0.005)
                        x.wins++;
                }
            });
        });
        const teamRows = Object.values(T).filter(x => x.trades).sort((a, b) => b.net - a.net);
        const sorted = A.slice().sort(tradeSort === 'recent' ? (a, b) => (b.t.created || 0) - (a.t.created || 0) : (a, b) => b.spread - a.spread);
        $('#view').innerHTML = `
            <section class="panel">
              <div class="panel-head"><h3>Trade scoreboard</h3><span class="pill">Net pts/wk from trades</span></div>
              <div class="table-wrap"><table>
                <thead><tr><th>#</th><th>Team</th><th>Trades</th><th>Trades won</th><th>Combined net pts/wk</th><th>Total net pts</th></tr></thead>
                <tbody>${teamRows.map((x, i) => `<tr><td>${i + 1}</td><td><strong>${esc(teamName(x.r))}</strong></td><td>${x.trades}</td><td>${x.wins}</td>
                  <td class="${x.net >= 0 ? 'positive' : 'negative'}">${sgn(x.net)}</td><td class="${x.total >= 0 ? 'positive' : 'negative'}">${sgn(x.total)}</td></tr>`).join('')}</tbody>
              </table></div>
              <p class="small muted">Net pts/wk = average weekly points of players received minus players sent, over completed weeks after the trade. Raw player points, not starters-only. Draft picks and FAAB are shown but not scored. "Combined" adds up each trade's per-week net.</p>
            </section>
            <section class="panel">
              <div class="panel-head"><h3>All trades · ${A.length}</h3>
                <select id="tradeSort"><option value="lopsided" ${tradeSort === 'lopsided' ? 'selected' : ''}>Ranked: most lopsided</option><option value="recent" ${tradeSort === 'recent' ? 'selected' : ''}>Most recent</option></select></div>
              ${sorted.map((a, i) => tradeCardHTML(a, tradeSort === 'lopsided' && a.n ? i + 1 : 0)).join('')}
            </section>`;
        $('#tradeSort').addEventListener('change', e => {
            tradeSort = e.target.value;
            renderTradeCenter();
        });
    }

    /* ---------- loaders ---------- */

    async function loadDraftPicks() {
        draftPickByPlayer = {};
        try {
            const drafts = await get(`/league/${LEAGUE_ID}/drafts`);
            const draft = drafts?.find(d => d.status === 'complete') || drafts?.[0];
            if (!draft)
                return;
            const picks = await get(`/draft/${draft.draft_id}/picks`);
            (picks || []).forEach(p => {
                if (p.player_id)
                    draftPickByPlayer[p.player_id] = `Rd ${p.round}, Pick ${p.pick_no}`;
            });
        } catch (e) {
            console.warn('Draft data unavailable', e);
        }
    }
    async function loadTradeCounts() {
        completedTrades = 0;
        teamTradeCounts = {};
        faabTraded = {};
        tradeLog = [];
        const results = await Promise.all(Array.from({
            length: 19
        }, (_, i) => get(`/league/${LEAGUE_ID}/transactions/${i}`).catch(() => [])));
        const seen = new Set();
        results.forEach((rows, leg) => (rows || []).forEach(t => {
            if (!t || t.type !== 'trade' || t.status !== 'complete' || seen.has(t.transaction_id))
                return;
            seen.add(t.transaction_id);
            completedTrades++;
            tradeLog.push({
                ...t,
                leg
            });
            [...new Set(t.roster_ids || [])].forEach(id => teamTradeCounts[id] = (teamTradeCounts[id] || 0) + 1);
            (t.waiver_budget || []).forEach(w => {
                const amt = Number(w.amount || 0);
                faabTraded[w.sender] = (faabTraded[w.sender] || 0) - amt;
                faabTraded[w.receiver] = (faabTraded[w.receiver] || 0) + amt;
            });
        }));
        window.tradeLog = tradeLog; // inspect in the console if a count looks off
    }
    async function loadTeamMargins() {
        teamMargins = {};
        const maxWeek = Math.max(0, curWeek() - 1);
        if (!maxWeek)
            return;
        const results = await Promise.all(Array.from({
            length: maxWeek
        }, (_, i) => get(`/league/${LEAGUE_ID}/matchups/${i + 1}`).catch(() => [])));
        results.forEach(rows => {
            groupMatchups(rows).forEach(g => {
                const a = g[0],
                    b = g[1],
                    difference = score(a) - score(b);
                [[a.roster_id, difference], [b.roster_id, -difference]].forEach(([id, d]) => {
                    teamMargins[id] ??= {
                        win: [],
                        loss: []
                    };
                    if (d > 0)
                        teamMargins[id].win.push(d);
                    if (d < 0)
                        teamMargins[id].loss.push(Math.abs(d));
                });
            });
        });
    }
    async function loadSeasonPlayerStats() {
        seasonPlayerStats = {};
        weeklyPts = {};
        const season = league.season;
        const completedWeeks = Math.max(0, curWeek() - 1);
        if (!completedWeeks)
            return;
        const results = await Promise.all(Array.from({
            length: completedWeeks
        }, (_, i) =>
        getData(`/stats/nfl/${season}/${i + 1}?season_type=regular`).catch(() => ({}))
        ));
        results.forEach((data, i) => {
            const w = i + 1;
            weeklyPts[w] = {};
            Object.entries(normalizeRows(data)).forEach(([id, row]) => {
                if (!players[id] || !row)
                    return;
                const points = playerStatPoints(row);
                weeklyPts[w][id] = points;
                seasonPlayerStats[id] ??= {
                    total: 0,
                    games: 0,
                    expected: 0,
                    projectionGames: 0
                };
                seasonPlayerStats[id].total += points;
                if (Number(row.gp || 0) > 0 || points !== 0)
                    seasonPlayerStats[id].games++;
            });
        });
        // position rank = average points per game played
        const byPosition = {};
        Object.entries(seasonPlayerStats).forEach(([id, x]) => {
            const position = pos(id);
            if (position && x.games >= MIN_GAMES_FOR_RANK)
                (byPosition[position] ??= []).push({
                    id,
                    avg: x.total / x.games
                });
        });
        Object.values(byPosition).forEach(list => {
            list.sort((a, b) => b.avg - a.avg);
            list.forEach((x, i) => seasonPlayerStats[x.id].rank = i + 1);
        });
    }
    async function loadSeasonProjections() {
        const season = league.season;
        const completedWeeks = Math.max(0, curWeek() - 1);
        const results = await Promise.all(Array.from({
            length: completedWeeks
        }, (_, i) =>
        getData(`/projections/nfl/${season}/${i + 1}?season_type=regular`).catch(() => [])
        ));
        results.forEach(data => {
            Object.entries(normalizeRows(data)).forEach(([id, row]) => {
                if (!seasonPlayerStats[id])
                    return;
                const value = playerStatPoints(row);
                if (!Number.isFinite(value))
                    return;
                seasonPlayerStats[id].expected += value;
                seasonPlayerStats[id].projectionGames++;
            });
        });
    }

    /* ---------- awards / history ---------- */
    function expectedForPlayer(id) {
        const x = seasonPlayerStats[id];
        return x?.projectionGames ? x.expected / x.projectionGames : null;
    }
    function actualAverage(id) {
        const x = seasonPlayerStats[id];
        return x?.games ? x.total / x.games : null;
    }
    function playerOverExpected(id) {
        const actual = actualAverage(id),
            expected = expectedForPlayer(id);
        return actual === null || expected === null ? null : actual - expected;
    }
    const rosteredIds = () => new Set(rosters.flatMap(r => r.players || []));
    function teamForPlayer(id) {
        const roster = rosters.find(r => (r.players || []).includes(id));
        return roster ? teamName(roster) : '—';
    }
    function getPlayerLeaders() {
        const R = rosteredIds();
        const eligible = Object.keys(seasonPlayerStats).filter(id => R.has(id) && seasonPlayerStats[id]?.games > 0);
        const highest = eligible.slice().sort((a, b) => seasonPlayerStats[b].total - seasonPlayerStats[a].total)[0];
        const lowest = eligible.slice().sort((a, b) => seasonPlayerStats[a].total - seasonPlayerStats[b].total)[0];
        const over = eligible.filter(id => playerOverExpected(id) !== null).sort((a, b) => playerOverExpected(b) - playerOverExpected(a))[0];
        const under = eligible.filter(id => playerOverExpected(id) !== null).sort((a, b) => playerOverExpected(a) - playerOverExpected(b))[0];
        return {
            highest,
            lowest,
            over,
            under
        };
    }
    function getTeamExpectedLeaders() {
        const totals = {};
        rosters.forEach(r => {
            let actual = 0,
                expected = 0,
                hasExpected = false;
            (r.players || []).forEach(id => {
                const x = seasonPlayerStats[id];
                if (!x)
                    return;
                actual += x.total;
                if (x.projectionGames) {
                    expected += x.expected;
                    hasExpected = true;
                }
            });
            if (hasExpected)
                totals[r.roster_id] = {
                    name: teamName(r),
                    diff: actual - expected
                };
        });
        const rows = Object.values(totals);
        return {
            over: rows.slice().sort((a, b) => b.diff - a.diff)[0],
            under: rows.slice().sort((a, b) => a.diff - b.diff)[0]
        };
    }
    async function loadAwardHistory() {
        awards = [];
        const season = league.season;
        const completedWeeks = Math.max(0, curWeek() - 1);
        if (!completedWeeks)
            return;
        const results = await Promise.all(Array.from({
            length: completedWeeks
        }, async (_, i) => {
            const w = i + 1;
            const [stats, projections] = await Promise.all([
            getData(`/stats/nfl/${season}/${w}?season_type=regular`).catch(() => ({})),
            getData(`/projections/nfl/${season}/${w}?season_type=regular`).catch(() => [])
            ]);
            return {
                week: w,
                stats: normalizeRows(stats),
                projections: normalizeRows(projections)
            };
        }));
        const rostered = new Set(rosters.flatMap(r => r.players || []));
        results.forEach(({week: w, stats, projections}) => {
            const weekly = [];
            Object.entries(stats).forEach(([id, row]) => {
                if (!rostered.has(id) || !players[id])
                    return;
                const actual = playerStatPoints(row),
                    projectedRow = projections[id];
                const expected = projectedRow ? playerStatPoints(projectedRow) : null;
                weekly.push({
                    id,
                    actual,
                    expected,
                    diff: expected === null ? null : actual - expected,
                    position: pos(id)
                });
            });
            if (!weekly.length)
                return;
            const add = (category, p) => {
                if (!p)
                    return;
                awards.push({
                    week: w,
                    category,
                    player: p.id,
                    team: teamForPlayer(p.id),
                    points: p.actual,
                    diff: p.diff
                });
            };
            add('Weekly MVP', weekly.slice().sort((a, b) => b.actual - a.actual)[0]);
            ['QB', 'RB', 'WR', 'TE', 'K', 'DEF'].forEach(position => {
                add(`Top ${position}`, weekly.filter(p => p.position === position).sort((a, b) => b.actual - a.actual)[0]);
            });
            add('Best over projection', weekly.filter(p => p.diff !== null && p.diff > 0).sort((a, b) => b.diff - a.diff)[0]);
        });
    }
    function renderHistory() {
        const categories = ['Weekly MVP', 'Top QB', 'Top RB', 'Top WR', 'Top TE', 'Top K', 'Top DEF', 'Best over projection'];
        const byCat = {};
        awards.forEach(a => {
            (byCat[a.category] ??= {});
            (byCat[a.category][a.team] ??= []).push(a);
        });
        const categoryCards = categories.map(category => {
            const leaders = Object.entries(byCat[category] || {}).sort((a, b) => b[1].length - a[1].length).slice(0, 3);
            return `<div class="award">
                  <div class="award-label">${esc(category)} · top teams</div>
                  ${leaders.length ? leaders.map(([team, list], i) => `<details class="tdet"><summary><strong>${i + 1}. ${esc(team)}</strong><span class="award-score">${list.length} win${list.length > 1 ? 's' : ''}</span></summary>${list.slice().sort((a, b) => b.week - a.week).map(a => `<div class="tp"><span>Wk ${a.week} · ${esc(playerName(a.player))}</span><span class="muted">${num(a.points)} pts</span></div>`).join('')}</details>`).join('') : '<div class="award-meta">No winners recorded</div>'}
                </div>`;
        }).join('');
        const leaders = getPlayerLeaders();
        const teamLeaders = getTeamExpectedLeaders();
        const lowestTeam = rosters.slice().sort((a, b) => teamPoints(a) - teamPoints(b))[0];
        const topTeam = rosters.slice().sort((a, b) => teamPoints(b) - teamPoints(a))[0];
        function leaderCard(label, name, value, detail='') {
            return `<div class="award"><div class="award-label">${esc(label)}</div>
                  <strong>${esc(name || '—')}</strong><div class="award-meta">${value}</div>
                  ${detail ? `<div class="award-meta">${detail}</div>` : ''}</div>`;
        }
        const season = league?.season || 'Current';
        const seasonCards = [
        leaderCard(`${season} team points leader`, topTeam ? teamName(topTeam) : '—', topTeam ? `${num(teamPoints(topTeam))} points` : '—'),
        leaderCard(`${season} highest-scoring player`, leaders.highest ? playerName(leaders.highest) : '—', leaders.highest ? `${num(seasonPlayerStats[leaders.highest].total)} total points` : 'No stats available'),
        leaderCard(`${season} team most over expected`, teamLeaders.over?.name || '—', teamLeaders.over ? `+${num(teamLeaders.over.diff)} points` : 'No projection data'),
        leaderCard(`${season} player most over expected`, leaders.over ? playerName(leaders.over) : '—', leaders.over ? `+${num(playerOverExpected(leaders.over))} average points vs expected` : 'No projection data'),
        leaderCard(`${season} lowest-scoring team`, lowestTeam ? teamName(lowestTeam) : '—', lowestTeam ? `${num(teamPoints(lowestTeam))} points` : '—'),
        leaderCard(`${season} player most under expected`, leaders.under ? playerName(leaders.under) : '—', leaders.under ? `${num(playerOverExpected(leaders.under))} average points vs expected` : 'No projection data')
        ].join('');
        const positionRows = ['QB', 'RB', 'WR', 'TE', 'K', 'DEF'].map(position => {
            const R = rosteredIds();
            const ids = Object.keys(seasonPlayerStats).filter(id => R.has(id) && pos(id) === position && playerOverExpected(id) !== null);
            const sorted = ids.slice().sort((a, b) => playerOverExpected(b) - playerOverExpected(a));
            const over = sorted[0],
                under = sorted[sorted.length - 1];
            return `<tr><td><strong>${position}</strong></td>
                  <td>${over ? `${esc(playerName(over))} <span class="positive">+${num(playerOverExpected(over))}</span>` : '—'}</td>
                  <td>${under ? `${esc(playerName(under))} <span class="negative">${num(playerOverExpected(under))}</span>` : '—'}</td></tr>`;
        }).join('');
        const filtered = awardFilter === 'All' ? awards : awards.filter(a => a.category === awardFilter);
        const history = filtered.slice().sort((a, b) => b.week - a.week || a.category.localeCompare(b.category));
        $('#view').innerHTML = `
            <section class="panel">
              <div class="panel-head"><h3>${season} season leaders</h3><span class="pill">Season to date</span></div>
              <div class="award-grid">${seasonCards}</div>
            </section>
            <section class="panel">
              <div class="panel-head"><h3>Award category leaders</h3><span class="pill">Top three teams</span></div>
              <div class="award-grid">${categoryCards}</div>
            </section>
            <section class="panel">
              <div class="panel-head"><h3>Points over / under expected by position</h3></div>
              <div class="table-wrap"><table>
                <thead><tr><th>Position</th><th>Most over expected</th><th>Most under expected</th></tr></thead>
                <tbody>${positionRows}</tbody>
              </table></div>
              <p class="small muted">Rostered players only. Difference is average actual fantasy points minus average projected points per game. Players without projection data are excluded.</p>
            </section>
            <section class="panel">
              <div class="panel-head"><h3>Weekly award history</h3>
                <select id="awardFilter">${['All', ...categories].map(c => `<option value="${esc(c)}" ${c === awardFilter ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>
              </div>
              ${history.length ? history.map(a => `
                <div class="history-row">
                  <div class="week-tag">Week ${a.week}</div>
                  <div><div class="history-player">${esc(playerName(a.player))}</div><div class="history-sub">${esc(a.category)} · ${esc(a.team)}</div></div>
                  <div class="award-score">${num(a.points)} pts</div>
                </div>`).join('') : '<div class="empty">No award winners available yet.</div>'}
            </section>`;
        $('#awardFilter').addEventListener('change', e => {
            awardFilter = e.target.value;
            renderHistory();
        });
    }

    /* ---------- shell ---------- */
    function renderStats() {
        $('#stats').innerHTML = [
        metricCard('Teams', rosters.length),
        metricCard('Completed trades', completedTrades),
        metricCard('Season', league?.season || '—'),
        metricCard('Week', curWeek())
        ].join('');
        if (league && state && String(league.season) !== String(state.season))
            $('#errorBox').innerHTML = `<div class="error">This league ID is the ${esc(league.season)} season, but Sleeper's NFL calendar is on ${esc(state.season)}. Point LEAGUE_ID at the current season's league.</div>`;
    }
    function renderTab() {
        document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === activeTab));
        const titles = {
            overview: 'League overview',
            standings: 'League standings',
            matchups: 'Weekly matchups',
            trades: 'Trade center',
            rosters: 'Team rosters',
            history: 'Player history & awards'
        };
        $('#pageTitle').textContent = titles[activeTab] || 'League overview';
        if (activeTab === 'overview')
            renderOverview();
        else if (activeTab === 'standings')
            renderStandings();
        else if (activeTab === 'matchups')
            renderMatchups();
        else if (activeTab === 'trades')
            renderTradeCenter();
        else if (activeTab === 'rosters')
            renderRosters();
        else if (activeTab === 'history')
            renderHistory();
    }
    async function loadWeek() {
        const [rows] = await Promise.all([get(`/league/${LEAGUE_ID}/matchups/${week}`), loadCurrentWeekData()]);
        matchups = rows || [];
        renderTab();
    }
    async function setWeek(value) {
        const max = curWeek();
        week = Math.max(1, Math.min(max, Number(value) || 1));
        $('#weekSelect').value = String(week);
        $('#liveStatus').textContent = 'Loading week…';
        try {
            await loadWeek();
            $('#liveStatus').textContent = `Week ${week} · Updated ${new Date().toLocaleTimeString()}`;
        } catch (e) {
            $('#errorBox').innerHTML = `<div class="error">Week data could not load: ${esc(e.message)}</div>`;
        }
    }
    async function refreshAll() {
        $('#liveStatus').textContent = 'Refreshing live data…';
        $('#errorBox').innerHTML = '';
        try {
            const [leagueData, userData, rosterData, stateData] = await Promise.all([
            get(`/league/${LEAGUE_ID}`), get(`/league/${LEAGUE_ID}/users`), get(`/league/${LEAGUE_ID}/rosters`), get('/state/nfl')
            ]);
            league = leagueData;
            users = userData || [];
            rosters = rosterData || [];
            state = stateData;
            $('#leagueMeta').textContent = `${league.name || 'Sleeper league'} · ${league.season} season · ${rosters.length} teams`;
            $('#seasonLabel').textContent = `NFL ${league.season} · LIVE DATA`;
            const maxWeek = Math.max(1, curWeek());
            if (!initialized) {
                week = Math.min(maxWeek, Number(state.display_week || state.week || 1));
                initialized = true;
            } else
                week = Math.min(week, maxWeek);
            $('#weekSelect').innerHTML = Array.from({
                length: maxWeek
            }, (_, i) => `<option value="${i + 1}">Week ${i + 1}</option>`).join('');
            $('#weekSelect').value = String(week);
            await loadPlayers();
            await loadWeek();
            // History, trades and season stats only reload when the NFL week changes.
            if (seasonDataWeek !== curWeek()) {
                await Promise.all([loadDraftPicks(), loadTradeCounts(), loadTeamMargins(), loadSeasonPlayerStats()]);
                await loadSeasonProjections();
                await loadAwardHistory();
                seasonDataWeek = curWeek();
            }
            renderStats();
            renderTab();
            $('#liveStatus').textContent = `LIVE · Updated ${new Date().toLocaleTimeString()}`;
        } catch (e) {
            $('#errorBox').innerHTML = `<div class="error">Dashboard could not load: ${esc(e.message)}. Check the Sleeper API connection.</div>`;
            $('#liveStatus').textContent = 'Connection error';
            console.error(e);
        }
    }
    document.querySelectorAll('.tab').forEach(button => {
        button.addEventListener('click', () => {
            activeTab = button.dataset.tab;
            renderTab();
        });
    });
    $('#refreshBtn').addEventListener('click', refreshAll);
    $('#weekSelect').addEventListener('change', e => setWeek(e.target.value));
    $('#prevWeek').addEventListener('click', () => setWeek(week - 1));
    $('#nextWeek').addEventListener('click', () => setWeek(week + 1));
    refreshAll();
    setInterval(refreshAll, 60000);
    </script>
</body>
</html>
